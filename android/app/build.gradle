// StreamBeam for Android: hosts the web app full screen and adds native screen discovery and casting
// (Google Cast + DLNA). Run `node configure.mjs https://your-app-address` first; it writes twa.properties
// and the URL-specific resources.
plugins {
    id 'com.android.application'
}

def twaFile = rootProject.file('twa.properties')
if (!twaFile.exists()) throw new GradleException('Run `node configure.mjs https://your-app-address` in android/ first.')
def twa = new Properties()
twaFile.withInputStream { twa.load(it) }

// Release signing comes from the environment (GitHub secrets); without it the build uses the debug key.
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'app.streambeam.caster'
    compileSdk 35

    defaultConfig {
        applicationId twa.getProperty('applicationId')
        minSdk 23
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName twa.getProperty('versionName', '1.0')
        manifestPlaceholders = [hostName: twa.getProperty('host'), pathPrefix: twa.getProperty('path', '/')]
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'streambeam'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
}
