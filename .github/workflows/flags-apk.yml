# Builds World Flags (the flag quiz game in web/flags/) as an Android APK: flags-android/.
# Every change to the game or the Android app builds the APK and publishes a release named world-flags-1.N.
# The release is not marked "latest", so the StreamBeam download link keeps pointing at StreamBeam.
name: World Flags APK

on:
  workflow_dispatch:
  push:
    paths:
      - "web/flags/**"
      - "flags-android/**"
      - ".github/workflows/flags-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a temporary debug key."
          fi

      - name: Build the APK
        working-directory: flags-android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          APK="out/WorldFlags-1.${{ github.run_number }}.apk"
          cp flags-android/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "### World Flags $(basename "$APK") is in the artifacts below" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: WorldFlags-apk
          path: out/

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "world-flags-1.${{ github.run_number }}" "$APK" \
            --target "${{ github.sha }}" --latest=false \
            --title "World Flags for Android 1.${{ github.run_number }}" \
            --notes "A colourful flag quiz: one flag, three names, beat the clock. Five levels, a 2 to 10 second timer, music and sound effects. Plays offline.

          **Install:** on your Android phone, download $(basename "$APK") below and open it. Allow installing from your browser when asked; if Play Protect warns about an unknown developer, tap More details → Install anyway."
