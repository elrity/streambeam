# Builds the StreamBeam Android app (APK) that opens your hosted StreamBeam full screen.
# Every change to android/ builds and releases an APK for the GitHub Pages address.
# To build for another address: Actions → "Android APK" → Run workflow, or set the APP_URL variable.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "App address (leave empty for https://elrity.github.io/streambeam/)"
        required: false
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Point the app at your StreamBeam address
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://elrity.github.io/streambeam/' }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::No app address given, so this is a check build for https://example.com. Run the workflow with your address, or set the APP_URL repository variable."
            APP_URL=https://example.com
            echo "CHECK_BUILD=1" >> "$GITHUB_ENV"
          fi
          node android/configure.mjs "$APP_URL" app.streambeam.caster "1.${{ github.run_number }}"
          echo "APP_HOST=$(grep '^host=' android/twa.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a temporary debug key. It installs fine, but each new build must replace the old one by uninstalling it first. See android/README.md to add a permanent key."
          fi

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK and write assetlinks.json
        run: |
          mkdir -p out
          APK="out/StreamBeam-1.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify "$APK"
          SHA=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr a-f A-F | sed 's/../&:/g; s/:$//')
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"app.streambeam.caster","sha256_cert_fingerprints":["%s"]}}]\n' "$SHA" > out/assetlinks.json
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "CERT_SHA=$SHA" >> "$GITHUB_ENV"
          {
            echo "### StreamBeam APK for https://$APP_HOST"
            echo ""
            echo "Download it from the artifacts below${CHECK_BUILD:+ (check build only, not for installing)}."
            echo ""
            echo "To hide the browser bar, set this on the server (Render → Environment): \`ANDROID_CERT_SHA256=$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: StreamBeam-apk-${{ env.APP_HOST }}
          path: out/

      - name: Publish a release
        if: env.CHECK_BUILD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${{ github.run_number }}" "$APK" out/assetlinks.json \
            --target "${{ github.sha }}" \
            --title "StreamBeam for Android 1.${{ github.run_number }}" \
            --notes "Opens https://$APP_HOST full screen. On your phone, download the .apk below and open it (allow installing from your browser when asked). Server setting to hide the browser bar: ANDROID_CERT_SHA256=$CERT_SHA"
