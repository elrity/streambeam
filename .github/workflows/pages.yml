# Publishes the web app (web/) to GitHub Pages: https://elrity.github.io/streambeam/
# and RoomFit, the AR furniture app (web/furniture/): https://elrity.github.io/streambeam/furniture/
name: Publish web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir _site
          cp web/index.html web/manifest.webmanifest web/sw.js _site/
          cp -r web/icons _site/
          cp -r web/furniture _site/furniture
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
