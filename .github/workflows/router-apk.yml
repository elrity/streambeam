# Builds RouterPilot, the router control app (router-android/ + the screens in web/router/), as an APK
# and publishes it as a GitHub release named "RouterPilot …". The StreamBeam "latest release" link is left alone.
name: RouterPilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "router-android/**"
      - "web/router/**"
      - ".github/workflows/router-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a temporary debug key. Each new build must then replace the old one by uninstalling it first."
          fi

      - name: Build the APK
        working-directory: router-android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          APK="out/RouterPilot-1.${{ github.run_number }}.apk"
          cp router-android/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "### RouterPilot \`$(basename "$APK")\` is in the artifacts below and in the release." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: RouterPilot-apk
          path: out/

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "routerpilot-1.${{ github.run_number }}" "$APK" \
            --target "${{ github.sha }}" --latest=false \
            --title "RouterPilot for Android 1.${{ github.run_number }}" \
            --notes "Control your home router from your phone: see connected devices, stop a device's internet, speed limits, priority, block websites, turn Wi-Fi off (it comes back when the router restarts) and restart the router.

          Works with **OpenWrt** (LuCI) and **MikroTik** (RouterOS 7) routers, plus a demo mode. Setup: see router-android/README.md.

          **Install:** on your Android phone, download $(basename "$APK") below and open it. Allow installing from your browser when asked; if Play Protect warns about an unknown developer, tap More details → Install anyway."
