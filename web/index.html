<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9dade">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StreamBeam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- APP-START -->
<title>StreamBeam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
/* Layout: the app fills the screen exactly (no page scroll). Home = emblem + "connect" line above a square 3×3
   keypad of section buttons; landscape puts them side by side. Sections = fixed header + one content region.
   Light (default): white rising from the bottom, a little darker under the status bar; black as the second colour.
   Surfaces are transparent so the gradient shows through; raised/pressed comes from paired soft shadows. */
:root {
  --bg: #eeeff1; --bg-top: #d9dade; --bg-bottom: #fcfcfd; --sheet: #f3f3f5; --knob: #f9f9fa;
  --fg: #141416; --muted: #85878d; --faint: #c6c7cb; --line: rgba(0, 0, 0, .07);
  --hi: rgba(255, 255, 255, .95); --lo: rgba(146, 149, 158, .42);
  --accent: #141416; --accent-ink: #fcfcfd; --warm: #e5533a; --ok: #2f9e6e;
  --emblem: #8a8c92; --disc-a: #ffffff; --disc-b: #e9eaed; --screen: #121316;
  --raise: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi);
  --raise-sm: 4px 4px 10px var(--lo), -4px -4px 10px var(--hi);
  --inset: inset 4px 4px 9px var(--lo), inset -4px -4px 9px var(--hi);
  --inset-sm: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi);
  --f-ui: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter: max(18px, env(safe-area-inset-left, 0px));
  --gutter-r: max(18px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1f2023; --bg-top: #131416; --bg-bottom: #26282c; --sheet: #23252a; --knob: #34363b;
  --fg: #ececee; --muted: #8e9097; --faint: #484a50; --line: rgba(255, 255, 255, .07);
  --hi: rgba(255, 255, 255, .05); --lo: rgba(0, 0, 0, .55);
  --accent: #f2f2f3; --accent-ink: #141416; --warm: #ff7759; --ok: #5cc79c;
  --emblem: #75777e; --disc-a: #2b2d32; --disc-b: #1d1e21; --screen: #0b0c0e;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body > video { display: none; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); background-image: linear-gradient(to top, var(--bg-bottom), var(--bg) 55%, var(--bg-top)); background-attachment: fixed; color: var(--fg); font: 400 16px/1.5 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.mono, .label { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.acc { color: var(--accent); }
.muted { color: var(--muted); }

/* Surfaces: rounded squares, raised by default, pressed when active */
.round { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: transparent; box-shadow: var(--raise-sm); color: var(--fg); flex: none; transition: box-shadow .15s; }
.round:active, .round[aria-pressed="true"] { box-shadow: var(--inset-sm); }
.round.sm { width: 40px; height: 40px; border-radius: 13px; }
.round.sm svg.i { width: 18px; height: 18px; }
.round:disabled { opacity: .38; cursor: default; }
.round.acc { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px; background: transparent; box-shadow: var(--raise-sm); font-size: 15px; white-space: nowrap; transition: box-shadow .15s; }
.btn:active, .btn[aria-pressed="true"] { box-shadow: var(--inset-sm); }
.btn.acc { background: var(--accent); color: var(--accent-ink); box-shadow: 4px 4px 10px var(--lo), -3px -3px 8px var(--hi); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn svg.i { width: 18px; height: 18px; }
.btn.flat { box-shadow: none; padding: 0 10px; color: var(--muted); background: none; }
.field { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 8px 0 16px; border-radius: 16px; box-shadow: var(--inset); background: transparent; }
.field input, .field select { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; }
.field svg.i { color: var(--muted); width: 18px; height: 18px; }
textarea { width: 100%; min-height: 140px; resize: vertical; padding: 14px; border: 0; border-radius: 16px; box-shadow: var(--inset); background: transparent; font: 12.5px/1.55 var(--f-mono); outline: none; }

/* App frame: header + one region; only that region may scroll, never the page */
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.main { flex: 1; min-height: 0; overflow: hidden; padding-left: var(--gutter); padding-right: var(--gutter-r); }
.view { height: 100%; display: flex; flex-direction: column; }
.head { flex: none; display: flex; align-items: center; gap: 14px; padding-block: 12px 10px; max-width: 720px; width: 100%; margin: 0 auto; }
.head .grow { flex: 1; min-width: 0; }
.head h1 { margin: 0; font: 500 12px/1 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; }
.head .sub { margin-top: 4px; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter)); padding: 8px var(--gutter-r) 20px var(--gutter); }
.scroll::-webkit-scrollbar { display: none; }
.inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Home */
.home-top { flex: none; display: flex; align-items: center; justify-content: space-between; padding-block: 12px 4px; }
.home-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2vh; padding-bottom: 14px; }
.hero { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1vh; }
.emblem-btn { display: block; width: min(76vw, 33vh, 360px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; }
.emblem { width: 100%; height: 100%; overflow: visible; display: block; }
.emblem .disc { fill: url(#discFill); filter: drop-shadow(14px 18px 16px var(--lo)) drop-shadow(-6px -6px 10px var(--hi)); }
.emblem .line { fill: none; stroke: var(--emblem); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.emblem .prog { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dasharray .5s; }
.emblem .word { fill: var(--fg); font: 400 38px/1 var(--f-ui); letter-spacing: 12px; }
.emblem .time { fill: var(--fg); font: 200 64px/1 var(--f-ui); }
.emblem-btn:active .disc { filter: drop-shadow(6px 8px 8px var(--lo)); }
.connect { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 100%; text-align: center; }
.c-title { position: relative; max-width: 84vw; font: 200 clamp(26px, 4.4vh, 38px)/1.1 var(--f-ui); letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: .5em; }
.c-title::after { content: ""; position: absolute; right: 0; top: .1em; width: .26em; height: .26em; border-radius: 50%; border: 1.5px solid var(--warm); }
.connect.on .c-title::after { background: var(--ok); border-color: var(--ok); }
.c-sub { font: 500 10px/1.4 var(--f-mono); letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
.connect.on .c-sub { color: var(--fg); }
.pad { flex: 1; min-height: 120px; container-type: size; display: grid; place-items: center; }
.grid { width: min(100cqw, 100cqh, 460px); height: min(100cqw, 100cqh, 460px); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: min(16px, 4.2cqmin); padding: min(10px, 2cqmin); }
.go { position: relative; border-radius: 22%; box-shadow: var(--raise-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8%; color: var(--fg); transition: box-shadow .15s; }
.go:active { box-shadow: var(--inset-sm); }
.go svg.i { width: 30%; height: 30%; max-width: 30px; max-height: 30px; }
.go .label { color: var(--fg); font-size: clamp(8px, 2.5cqmin, 11px); letter-spacing: .14em; }
.go .count { position: absolute; top: 10%; right: 10%; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: 500 10px/18px var(--f-mono); }

/* Lists */
.panel { border-radius: 22px; box-shadow: var(--raise); padding: 6px 0; }
.panel-t { display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px; }
.panel-t .grow { flex: 1; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; }
.row + .row { border-top: 1px solid var(--line); }
.row.on .t { font-weight: 500; }
.thumb { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; color: var(--fg); box-shadow: var(--inset-sm); background-size: cover; background-position: center; overflow: hidden; }
.meta { min-width: 0; }
.meta .t { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .s { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; font: 400 11px/1.4 var(--f-mono); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.meta .s .tag-YOUTUBE, .meta .s .tag-LIVE { color: var(--warm); }
.acts { display: flex; gap: 8px; align-items: center; }
.empty { padding: 26px 20px; text-align: center; color: var(--muted); font-size: 14px; }

/* Remote */
.np { display: flex; flex-direction: column; gap: 20px; }
.np-l, .np-r { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 20px; overflow: hidden; background: var(--screen); box-shadow: var(--raise); }
.screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.screen .poster { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 6%; color: #fff; }
.screen .poster h3 { margin: 0; font: 300 clamp(20px, 4.4vw, 34px)/1.1 var(--f-ui); }
.screen .idle { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .45); font: 500 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; }
.screen .osd { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 12px 14px; font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; color: #fff; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.screen .cue { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); max-width: 86%; text-align: center; padding: 3px 8px; border-radius: 4px; background: rgba(0, 0, 0, .72); color: #fff; }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warm); margin-right: 6px; vertical-align: 1px; }
.np-title { font: 300 24px/1.2 var(--f-ui); overflow-wrap: anywhere; }
.seek { display: flex; flex-direction: column; gap: 8px; }
.times { display: flex; justify-content: space-between; font: 400 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; box-shadow: var(--inset-sm); background: linear-gradient(to right, var(--accent) 0 var(--p, 0%), transparent var(--p, 0%)); background-size: 100% 2px; background-repeat: no-repeat; background-position: center; }
input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; box-shadow: var(--inset-sm); background: linear-gradient(to right, var(--accent) 0 var(--p, 0%), transparent var(--p, 0%)); background-size: 100% 2px; background-repeat: no-repeat; background-position: center; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 8px; background: var(--knob); box-shadow: var(--raise-sm); border: 0; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 8px; background: var(--knob); box-shadow: var(--raise-sm); border: 0; }
input[type=range]:disabled { opacity: .45; }
.transport { display: flex; justify-content: center; align-items: center; gap: 12px; }
.transport .big { width: 74px; height: 74px; border-radius: 22px; color: var(--accent); }
.transport .big svg.i { width: 28px; height: 28px; }
.pills { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.volrow { display: flex; align-items: center; gap: 14px; }
.volrow input { flex: 1; }
.devpill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.note { padding: 14px 18px; border-radius: 18px; box-shadow: var(--inset-sm); font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.note b { color: var(--fg); font-weight: 400; }
.note.warn { color: var(--fg); }
.note .acts { flex-wrap: wrap; }
.yt-host { position: fixed; z-index: 3; left: -9999px; top: 0; width: 320px; height: 180px; visibility: hidden; border-radius: 20px; overflow: hidden; background: #000; }
.yt-host iframe { width: 100%; height: 100%; border: 0; display: block; }

/* Sections */
.seg { display: inline-flex; padding: 5px; gap: 4px; border-radius: 16px; box-shadow: var(--inset); align-self: flex-start; }
.seg button { min-height: 36px; padding: 0 16px; border-radius: 12px; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg button[aria-pressed="true"] { box-shadow: var(--raise-sm); color: var(--fg); }
.chips { display: flex; gap: 10px; overflow-x: auto; padding: 6px 4px 10px; margin: 0 -4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 12px; box-shadow: var(--raise-sm); font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chip[aria-pressed="true"] { box-shadow: var(--inset-sm); color: var(--fg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.tile { aspect-ratio: 1.4; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-radius: 20px; box-shadow: var(--raise-sm); text-align: left; text-decoration: none; color: var(--fg); min-width: 0; }
.tile:active, .tile[aria-busy="true"] { box-shadow: var(--inset-sm); }
.tile b { font-weight: 400; font-size: 15px; }
.answer { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.md { font-size: 15.5px; line-height: 1.65; max-width: 68ch; overflow-wrap: anywhere; font-weight: 300; }
.md b { font-weight: 500; }
.md h3 { margin: 10px 0 2px; font: 500 12px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.md ul { margin: 4px 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.md p { margin: 4px 0; }
.md a, .sources a { color: var(--fg); }
.sources { display: flex; flex-wrap: wrap; gap: 8px; }
.sources a { font: 400 11px/1.4 var(--f-mono); padding: 6px 10px; border-radius: 10px; box-shadow: var(--raise-sm); text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.drop { border-radius: 22px; box-shadow: var(--inset); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted); }
.drop.over { box-shadow: var(--inset), 0 0 0 2px var(--accent); }
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 20px; }
.set + .set { border-top: 1px solid var(--line); }
.set .sub { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.set .field { min-height: 40px; width: min(220px, 42vw); }
.set select { border: 0; outline: none; background: transparent; font: 500 12px var(--f-mono); letter-spacing: .06em; padding: 10px 14px; border-radius: 12px; box-shadow: var(--raise-sm); }
.set select option { background: var(--sheet); }
.switch { position: relative; width: 58px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 11px; box-shadow: var(--inset); pointer-events: none; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 9px; background: var(--knob); box-shadow: 3px 3px 7px var(--lo), -2px -2px 5px var(--hi); transition: transform .18s; }
.switch input:checked + i::after { transform: translateX(26px); background: var(--accent); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 3px; }
details.more summary { list-style: none; cursor: pointer; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; font: 300 22px/1 var(--f-ui); color: var(--muted); }
details.more[open] summary::after { content: "–"; }
details.more .body { padding: 0 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.steps { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.steps b { color: var(--fg); font-weight: 400; }
code { font: 12px/1.5 var(--f-mono); overflow-wrap: anywhere; }
kbd { font: 500 11px/1 var(--f-mono); padding: 2px 6px; border-radius: 6px; box-shadow: var(--raise-sm); }
.big-go { align-self: center; width: 150px; height: 150px; border-radius: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: var(--raise); color: var(--fg); }
.big-go:active, .big-go.on { box-shadow: var(--inset); }
.big-go svg.i { width: 34px; height: 34px; }
.big-go.on { color: var(--warm); }

/* Mini player: part of the layout (never covers content) */
.mini { flex: none; display: flex; align-items: center; gap: 12px; width: min(560px, calc(100% - var(--gutter) - var(--gutter-r))); margin: 0 auto calc(12px + env(safe-area-inset-bottom, 0px)); padding: 8px 8px 8px 10px; border-radius: 22px; box-shadow: var(--raise); }
.mini .thumb { width: 44px; height: 44px; border-radius: 12px; }
.mini .meta { flex: 1; cursor: pointer; }
.mini .meta .t { font-size: 14.5px; }
.mini .ring { position: relative; }
.mini .ring svg { position: absolute; inset: -3px; width: 50px; height: 50px; pointer-events: none; }
.mini .ring rect { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20, 20, 22, .26); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(520px, 100%); max-height: 86%; overflow-y: auto; background: var(--sheet); border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px var(--lo); padding: 10px 0 calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--faint); margin: 4px auto 6px; }
.sheet header { display: flex; align-items: center; gap: 12px; padding: 8px 20px 4px; }
.sheet header .grow { flex: 1; }
.scan { display: flex; align-items: center; gap: 12px; padding: 8px 20px 12px; font-size: 13.5px; color: var(--muted); }
.radar { position: relative; width: 22px; height: 22px; flex: none; border-radius: 7px; box-shadow: var(--inset-sm); }
.radar::before, .radar::after { content: ""; position: absolute; inset: 8px; border-radius: 2px; background: var(--accent); }
.radar.on::after { inset: -4px; background: none; border: 1px solid var(--accent); border-radius: 9px; animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.dev { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 20px; text-align: left; }
.dev + .dev { border-top: 1px solid var(--line); }
.dev .round { width: 46px; height: 46px; }
.dev .dm { flex: 1; min-width: 0; }

  const j = await r.json().catch(() => ({}));

function parseSubs(text) {
  const toS = t => { const m = t.trim().replace(',', '.').match(/(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)/); return m ? (+m[1] || 0) * 3600 + +m[2] * 60 + +m[3] : 0; };
  return text.replace(/\r/g, '').split(/\n\n+/).map(b => {
    const lines = b.split('\n'); const i = lines.findIndex(l => l.includes('-->'));
    if (i < 0) return null;
    const [a, z] = lines[i].split('-->');
    return { a: toS(a), z: toS(z.split(' ').filter(Boolean)[0] || z), text: lines.slice(i + 1).join('\n').replace(/<[^>]+>/g, '') };
  }).filter(Boolean);
}

  try { const r = await fetch('gemini/status', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); GM.server = !!j.enabled; GM.model = j.model || ''; } } catch {}

}
const geminiReady = () => GM.server || !!S.settings.geminiKey;
function parseGemini(j) {
  const c = j.candidates?.[0];
  const text = (c?.content?.parts || []).map(p => p.text || '').join('').trim();
  const sources = (c?.groundingMetadata?.groundingChunks || []).map(x => x.web).filter(w => w && w.uri).map(w => ({ title: w.title || new URL(w.uri).hostname, uri: w.uri }));
  if (!text) throw new Error(c?.finishReason === 'SAFETY' ? 'Gemini declined to answer that.' : 'Gemini returned no answer. Try again.');
  return { text, sources };
}
async function gemini(prompt) {
  if (GM.server) {
    const r = await fetch('gemini', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'The server couldn’t reach Gemini (' + r.status + ').');
    return j;
  }
  const model = (S.settings.geminiModel || 'gemini-2.5-flash').trim();
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.settings.geminiKey.trim() },
    body: JSON.stringify({ systemInstruction: { parts: [{ text: SYSTEM }] }, contents: [{ role: 'user', parts: [{ text: prompt }] }], tools: [{ google_search: {} }] })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = j.error?.message || '';
    throw new Error(r.status === 400 && /API key/i.test(m) ? 'Gemini rejected the API key. Check it in Settings.' : r.status === 429 ? 'Gemini’s quota for this key is used up. Try again later.' : r.status === 404 ? `Gemini doesn’t know the model “${model}”. Change it in Settings.` : m || 'Gemini answered ' + r.status + '.');
  }
  return parseGemini(j);
}
async function ask(tile, custom) {
  const t = tile && TILES.find(x => x.id === tile);

  const prompt = t ? t.prompt() : `Today is ${todayStr()}${place() ? ' and I am in ' + place() : ''}. ${custom}`;
  const label = t ? t.label : custom;
  setView('today'); GM.err = '';
  if (!geminiReady()) { GM.answer = null; render(); return; }
  GM.busy = t ? t.id : 'custom'; GM.answer = { label, prompt, text: '', sources: [] }; render();
  try { Object.assign(GM.answer, await gemini(prompt), { at: Date.now() }); }
  catch (e) { GM.err = e instanceof TypeError ? 'Couldn’t reach Gemini. Check your connection.' : e.message; GM.answer = null; }

function locate() {

function md(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
  let html = '', list = false;
  text.split('\n').forEach(l => {
    const li = l.match(/^\s*[-*•]\s+(.*)/), h = l.match(/^#{1,4}\s+(.*)/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; return; }
    if (list) { html += '</ul>'; list = false; }
    if (h) html += `<h3>${inline(h[1])}</h3>`;
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  });
  return html + (list ? '</ul>' : '');
}
function speak() {
  if (!('speechSynthesis' in window) || !GM.answer) return toast('Reading aloud isn’t available in this browser.');

  const u = new SpeechSynthesisUtterance(GM.answer.text.replace(/\*\*|#+ |^\s*[-*•]\s+/gm, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'));
  u.lang = LOCALE; speechSynthesis.speak(u);
}

/* ---------- Sniffer ---------- */
const MEDIA_RE = /(?:https?:)?\/\/[^\s"'<>()]+?\.(?:mp4|m4v|webm|mov|mkv|avi|flv|wmv|ts|m3u8|mpd|mp3|m4a)(?:\?[^\s"'<>()]*)?/gi;
async function browse(raw) {
  let url = raw.trim(); if (!url) return;
  if (!/^[a-z]+:/i.test(url)) url = (/\s/.test(url) || !/\./.test(url)) ? 'https://duckduckgo.com/?q=' + encodeURIComponent(url) : 'https://' + url;
  S.url = url; S.notice = null;
  const site = SITES.find(s => s.url === url);
  if (site) { S.detected = site.media.map(m => ({ ...m, id: uid(), source: site.name })); S.notice = null; return render(); }
  if (ytParse(url)) {
    const it = ytItem(url); S.detected = [it];
    S.notice = null;
    render(); ytTitle(it); return;
  }
  if (/(^|\.)(youtube\.com|youtu\.be)$/i.test(new URL(url).hostname)) {
    S.detected = []; S.notice = { text: 'Paste a YouTube video link (Share → Copy link).', link: url }; return render();
  }
  if (fmtOf(url) !== 'MP4' || /\.(mp4|m4v)(\?|$)/i.test(url)) {
    if (/\.(mp4|m4v|webm|mov|mkv|avi|flv|wmv|ts|m3u8|mpd|mp3|m4a)(\?|$)/i.test(url)) {
      const name = decodeURIComponent(url.split('?')[0].split('/').pop()).replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
      S.detected = [{ id: uid(), title: name || 'Video', url, res: fmtOf(url) === 'HLS' ? 'Auto' : '—', size: '—', duration: 0, source: 'Direct link' }];
      S.notice = null;
      return render();
    }
  }
  S.notice = { ok: true, text: 'Looking for videos…' }; render();
  try {
    const res = await fetch(url, { mode: 'cors' });
    const html = await res.text();
    const found = new Map();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('video[src], source[src], a[href]').forEach(el => {
      const v = el.getAttribute('src') || el.getAttribute('href');
      if (el.tagName !== 'A' || /\.(mp4|m4v|webm|mov|mkv|m3u8|mpd)(\?|$)/i.test(v)) { try { found.set(new URL(v, url).href, el.closest('video')?.getAttribute('title') || ''); } catch {} }
    });
    (html.match(/(?:youtube(?:-nocookie)?\.com\/(?:embed\/|watch\?v=|shorts\/)|youtu\.be\/)[\w-]{11}/g) || []).forEach(m => { const it = ytItem('https://' + m.replace(/^/, m.startsWith('youtu.be') ? '' : 'www.')); if (!found.has(it.url)) found.set(it.url, ''); });
    (html.match(MEDIA_RE) || []).forEach(m => { try { const h = new URL(m.startsWith('//') ? 'https:' + m : m).href; if (!found.has(h)) found.set(h, ''); } catch {} });
    S.detected = [...found].map(([u, t]) => ytParse(u) ? ytItem(u, t) : ({ id: uid(), url: u, title: t || decodeURIComponent(u.split('?')[0].split('/').pop()), res: '—', size: '—', duration: 0, source: new URL(url).hostname }));
    S.detected.filter(m => ytParse(m.url)).forEach(ytTitle);
    S.notice = S.detected.length ? null : { ok: true, text: 'No videos on this page. Paste the video’s own link instead.' };
  } catch {
    S.detected = [];
    S.notice = { text: 'This site can’t be searched from here. Open it, copy the video link and paste it.', link: url };
  }
  render();
}

/* ---------- M3U ---------- */
function parseM3U(text) {
  const out = []; let cur = null;
  text.replace(/\r/g, '').split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (l.startsWith('#EXTINF')) {
      const attr = k => (l.match(new RegExp(k + '="([^"]*)"')) || [])[1] || '';
      cur = { title: l.slice(l.lastIndexOf(',') + 1).trim() || 'Channel', group: attr('group-title') || 'Other', logo: attr('tvg-logo') };
    } else if (!l.startsWith('#')) {
      if (ytParse(l)) l = ytUrl(ytParse(l));
      out.push({ id: uid(), ...(cur || { title: l.split('/').pop(), group: 'Other' }), url: l, live: fmtOf(l) === 'HLS' || fmtOf(l) === 'DASH', res: 'Live', size: '—', duration: 0 });
      cur = null;
    }
  });
  return out;
}

/* ---------- Native bridge (StreamBeam Android app) ----------
   The Android app injects window.StreamBeamNative (a WebView message channel open only to this site).
   It finds real screens on the Wi-Fi (Google Cast and DLNA/UPnP renderers over SSDP) and casts to them.
   In a plain browser it is absent: no network search is possible there, so none is faked. */
const NB = window.StreamBeamNative;
const N = { on: !!NB, devices: [], scanning: false, seq: 0, wait: new Map() };
let sheetKind = '';
if (NB) {
  NB.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.id && N.wait.has(m.id)) { const w = N.wait.get(m.id); N.wait.delete(m.id); m.ok ? w.res(m.result) : w.rej(new Error(m.error || 'The app couldn’t do that.')); return; }
    if (m.event === 'devices') {
      N.devices = m.devices || []; N.scanning = !!m.scanning;
      if (sheetKind === 'devices') drawDevices();
      if (S.view === 'home') updateConn();
    } else if (m.event === 'status') onNativeStatus(m);
    else if (m.event === 'session') onNativeSession(m);
  };
}
function ncall(cmd, args = {}) {
  if (!NB) return Promise.reject(new Error('Only in the StreamBeam app'));
  return new Promise((res, rej) => {
    const id = ++N.seq; N.wait.set(id, { res, rej });
    NB.postMessage(JSON.stringify({ id, cmd, args }));
    setTimeout(() => { if (N.wait.delete(id)) rej(new Error('The screen didn’t answer.')); }, 25000);
  });
}
const nativeOn = () => P.ext === 'native';
const castable = url => /^https?:/i.test(url) && !ytParse(url);
const MIME = { MP4: 'video/mp4', WEBM: 'video/webm', HLS: 'application/x-mpegURL', DASH: 'application/dash+xml', MKV: 'video/x-matroska', MOV: 'video/quicktime', AVI: 'video/x-msvideo', FLV: 'video/x-flv', WMV: 'video/x-ms-wmv', TS: 'video/mp2t', AUDIO: 'audio/mpeg' };
async function nativePlay(item, start) {
  try {
    await ncall('play', { deviceId: S.device.slice(2), url: item.url, title: item.title, mime: MIME[fmtOf(item.url)] || 'video/mp4', start: Math.floor(start || 0), live: !!item.live });
  } catch (e) { nativeFail(e); }
}
function nativeFail(e) { toast(e.message || 'The screen didn’t respond'); P.playing = false; tick(true); }
function onNativeStatus(m) {
  if (!nativeOn() || !P.item) return;
  if (m.duration > 0) { P.dur = m.duration; P.live = false; }
  if (m.position >= 0) P.pos = m.position;
  if (m.state === 'ended') { onEnded(); return; }
  const playing = m.state === 'playing' || m.state === 'buffering';
  if (playing !== P.playing) { P.playing = playing; tick(true); } else tick();
}
function onNativeSession(m) {
  if (S.device !== 'n:' + m.deviceId) return;
  if (m.state === 'ended') { if (nativeOn()) P.playing = false; toast('Disconnected from ' + devName()); render(); }
  else if (m.state === 'failed') toast(m.error || 'Couldn’t connect to ' + devName());
}
/* Remote-control commands for whichever external player is active (VLC relay or a native screen) */
function extCmd(cmd, v) {
  if (vlcOn()) {
    const m = { pause: ['pl_forcepause'], resume: ['pl_forceresume'], seek: ['seek', { val: Math.floor(v) }], volume: ['volume', { val: Math.round(v * 256) }], rate: ['rate', { val: v }], stop: ['pl_stop'] }[cmd];
    if (m) vlc(...m).catch(vlcFail);

  mirror() {

  iptv() {
    const ch = parseM3U(S.m3u);

        <details class="more"><summary><span class="label">Playlist</span></summary><div class="body">
          <textarea id="m3uText" aria-label="M3U playlist">${esc(S.m3u)}</textarea>
          <div class="pills" style="justify-content:flex-start"><label class="btn sm" for="m3uFile">${icon('upload')}Open file</label><input id="m3uFile" type="file" accept=".m3u,.m3u8,text/plain" hidden>

  today() {
    const ready = geminiReady();
    const tile = t => ready || (t.needsPlace && !place())
      ? `<button class="tile" data-ask="${t.id}" aria-busy="${GM.busy === t.id}">${icon(t.icon)}<b>${esc(t.label)}</b></button>`
      : `<a class="tile" href="https://gemini.google.com/app" target="_blank" rel="noopener" data-copyask="${t.id}">${icon(t.icon)}<b>${esc(t.label)}</b></a>`;
    const a = GM.answer;
    return `<form id="askForm" class="field" autocomplete="off">${icon('spark')}<input id="askInput" placeholder="Ask Gemini" aria-label="Ask Gemini" enterkeyhint="send"><button class="round sm acc" type="submit" aria-label="Ask" style="width:34px;height:34px">${icon('next')}</button></form>
      <div class="field">${icon('pin')}<input id="tCity" value="${esc(S.settings.city)}" placeholder="${GM.loc ? 'Using your location' : 'Your city'}" aria-label="Your city"><button class="btn flat sm" type="button" data-act="locate">Locate</button></div>
      ${GM.err ? `<div class="note warn">${esc(GM.err)}</div>` : ''}
      ${a ? `<section class="panel answer" aria-live="polite">
        <div style="display:flex;align-items:center;gap:10px"><span class="label" style="flex:1">${esc(a.label)}</span>
          ${a.text ? `<button class="round sm" data-act="speak" aria-label="Read aloud">${icon('speak')}</button><button class="round sm" data-act="copyAnswer" aria-label="Copy">${icon('copy')}</button>` : ''}</div>
        ${a.text ? `<div class="md">${md(a.text)}</div>` : '<div style="display:flex;gap:10px;align-items:center" class="muted"><i class="spin"></i>Asking Gemini…</div>'}
        ${a.sources?.length ? `<div class="sources">${a.sources.slice(0, 8).map(x => `<a href="${esc(x.uri)}" target="_blank" rel="noopener" title="${esc(x.title)}">${esc(x.title)}</a>`).join('')}</div>` : ''}
      </section>` : ''}
      <div class="tiles">${TILES.map(tile).join('')}</div>
      ${ready ? '' : '<div class="note">Tiles open Gemini with the question copied. <div class="acts"><button class="btn sm" data-act="geminiSetup">Add a Gemini key for answers here</button></div></div>'}`;
  },

  library() {
    const day = t => { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago'; };
    const h = S.libTab === 'history';
    return `<div class="seg" role="group"><button data-act="libTab" data-tab="history" aria-pressed="${h}">History</button><button data-act="libTab" data-tab="bookmarks" aria-pressed="${!h}">Bookmarks</button></div>
      ${h ? `<section class="panel"><div data-list="history">${S.history.length ? S.history.map(x => mediaRow({ ...x, res: day(x.at) + (x.pos > 5 ? ' · ' + fmt(x.pos) : ''), duration: 0 }, () => A.queue() + A.cast())).join('') : '<div class="empty">Nothing played yet.</div>'}</div></section>
          ${S.history.length ? '<button class="btn flat sm" data-act="clearHistory" style="align-self:center">Clear history</button>' : ''}`
        : `<section class="panel"><div data-list="bookmarks">${S.bookmarks.length ? S.bookmarks.map(b => `<div class="row" data-id="${b.id}"><div class="thumb" style="${softBg(b.title)}">${icon('star')}</div>
            <div class="meta"><div class="t">${esc(b.title)}</div><div class="s"><span style="text-transform:none">${esc(b.url.replace(/^https?:\/\//, ''))}</span></div></div>
            <div class="acts"><button class="round sm" data-act="unbookmark" aria-label="Remove">${icon('x')}</button><button class="round sm acc" data-act="openBm" aria-label="Open">${icon('globe')}</button></div></div>`).join('') : '<div class="empty">Tap ☆ in Browse to save a page.</div>'}</div></section>`}`;
  },

  settings() {
    const st = S.settings;
    const sw = (id, on) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><i></i></label>`;
    const sel = (id, vals, cur) => `<select id="${id}">${vals.map(v => `<option ${String(v) === String(cur) ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
    const txt = (id, val, ph, type = 'text') => `<div class="field"><input id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off"></div>`;
    return `<section class="panel"><div class="panel-t"><span class="label">Look</span></div>
        <div class="set"><span>Theme</span>${sel('s-theme', ['Light', 'Dark'], document.documentElement.dataset.theme === 'dark' ? 'Dark' : 'Light')}</div>
        <div class="set"><span>Home emblem</span>${sel('s-emblem', ['Nissan', 'Ring'], st.emblem === 'ring' ? 'Ring' : 'Nissan')}</div></section>
      <section class="panel"><div class="panel-t"><span class="label">Playback</span></div>
        <div class="set"><span>Autoplay queue</span>${sw('s-autoplay', st.autoplay)}</div>
        <div class="set"><span>Resume where I stopped</span>${sw('s-resume', st.resume)}</div>
        <div class="set"><span>Skip</span>${sel('s-skip', [5, 10, 15, 30, 60], st.skip)}</div>
        <div class="set"><span>Subtitle size</span>${sel('s-subSize', ['Small', 'Medium', 'Large'], st.subSize)}</div></section>
      <section class="panel" id="geminiSettings"><div class="panel-t"><span class="label">Today</span></div>
        <div class="set"><span>Gemini key<span class="sub">Free at aistudio.google.com/apikey. Stays on this device.</span></span>${txt('s-geminiKey', st.geminiKey, GM.server ? 'Server key in use' : 'AIza…', 'password')}</div>
        <div class="set"><span>Model</span>${txt('s-geminiModel', st.geminiModel, 'gemini-2.5-flash')}</div>
        <div class="set"><span>News country</span>${txt('s-region', st.region, REGION)}</div>
        <div class="set"><span>Temperature</span>${sel('s-units', ['Auto', '°C', '°F'], st.units === 'C' ? '°C' : st.units === 'F' ? '°F' : 'Auto')}</div></section>
      <section class="panel"><div class="panel-t"><span class="label">Screens</span></div>
        <div class="set"><span>Suggest VLC for MKV, AVI…</span>${sw('s-vlcFallback', st.vlcFallback)}</div>
        <div class="set"><span>VLC server<span class="sub">Address of server.mjs, for Cast to VLC.</span></span>${txt('s-vlcBridge', st.vlcBridge, 'http://192.168.1.10:8090')}</div>
        <div class="set"><span>Demo screens</span>${sw('s-demo', st.demo)}</div></section>
      <div class="label" style="text-align:center">StreamBeam${N.on ? ' · App' : ''}</div>`;
  }
};

function ytLink() {
  const y = P.yt; if (!y) return '';
  return y.id ? `https://www.youtube.com/watch?v=${y.id}${y.list ? '&list=' + y.list : ''}${P.pos > 5 ? '&t=' + Math.floor(P.pos) + 's' : ''}` : ytUrl(y);
}
function nativePanel() {
  const d = curDev();
  if (!d || !d.native || !d.away || !N.on || N.scanning) return '';
  return `<div class="note warn">${esc(d.name)} isn’t answering. Is it on, and on the same Wi-Fi?<div class="acts"><button class="btn sm" data-act="devices">${icon('refresh')}Search again</button></div></div>`;
}
function vlcPanel() {
  if (S.device === 'vlc' && !V.ok) {
    return `<div class="note warn"><b>Connect VLC</b>${V.err ? esc(V.err) : 'Start server.mjs next to VLC, then connect.'}
      <ol class="steps"><li>VLC: Tools → Preferences → All → Main interfaces → tick <b>Web</b>, set a Lua password.</li><li>Run <code>VLC_PASSWORD=… node web/server.mjs</code></li></ol>
      <div class="field" style="min-height:42px"><input id="vlcBridge" value="${esc(S.settings.vlcBridge)}" placeholder="${esc(vlcBase())}" aria-label="Server address"></div>
      <div class="acts"><button class="btn sm acc" data-act="vlcConnect" ${V.busy ? 'disabled' : ''}>${V.busy ? 'Connecting…' : 'Connect'}</button></div></div>`;
  }
  const it = P.item;
  if (!it || vlcOn() || nativeOn() || P.yt || !S.settings.vlcFallback) return '';
  const f = fmtOf(it.url);
  if (!(NEEDS_VLC.includes(f) || P.vidErr)) return '';
  return `<div class="note">${P.vidErr ? 'This video doesn’t play here.' : `${f} doesn’t play here.`} VLC plays it.<div class="acts"><button class="btn sm acc" data-act="vlc">${icon('vlc')}Open in VLC</button></div></div>`;
}
function ytNotice() {
  const msg = {
    loading: 'Loading YouTube…',
    blocked: 'YouTube can’t load here. Use the options below.',
    noembed: 'The owner only allows this video on YouTube.',
    missing: 'This video is private or unavailable.',
    badid: 'This YouTube link isn’t valid.',
    config: 'YouTube refused to play here.',
    html5: 'YouTube couldn’t play this video.',
    error: 'YouTube couldn’t play this video.'
  }[P.ytState];
  return msg ? `<div class="note ${P.ytState === 'loading' ? '' : 'warn'}">${msg}</div>` : '';
}
function ytPanel() {
  return `<section class="panel"><details class="more" ${S.device && S.device !== 'local' ? 'open' : ''}><summary><span class="label">YouTube on the TV</span></summary><div class="body">
    <div class="muted" style="font-size:14px">YouTube only casts from its own app.</div>
    <div class="pills" style="justify-content:flex-start"><a class="btn sm acc" href="${esc(ytLink())}" target="_blank" rel="noopener">Open in YouTube</a><button class="btn sm" data-act="ytCopy">${icon('copy')}Link</button><button class="btn sm" data-act="ytMirror">${icon('mirror')}Mirror</button></div>
    <div class="muted" style="font-size:13px">Or on the TV: YouTube → Settings → Link with TV code.</div></div></details></section>`;
}

function renderScreen() {
  const el = $('#screen'); if (!el) return;
  const it = P.item;
  if (!it) { el.innerHTML = `<div class="idle">${S.device ? esc(devName()) : 'No screen'}</div>`; return; }
  el.innerHTML = `<div class="poster" style="${poster(it.title)}"><h3>${esc(it.title)}</h3></div>
    <div class="osd"><span><i class="live-dot" style="background:${P.playing ? 'var(--warm)' : 'rgba(255,255,255,.5)'}"></i>${esc(devName())}</span><span id="osdTime">${P.live ? 'LIVE' : fmt(P.pos) + ' / ' + fmt(P.dur)}</span></div>
    <div class="cue" id="cue" hidden></div>`;
  video.hidden = !P.real;
  el.insertBefore(video, el.querySelector('.osd'));
  tick(true);
  placeYT();
}
function renderMirrorScreen() {
  const el = $('#mscreen'); if (!el) return;
  if (!M.stream) { el.innerHTML = `<div class="idle">${canCapture ? 'Not sharing' : 'Use the steps below'}</div>`; return; }
  el.innerHTML = `<div class="osd"><span><i class="live-dot"></i>${esc(devName())}</span><span id="mTime2"></span></div>`;
  el.insertBefore(mvid, el.firstChild);
  mvid.play().catch(() => {});
}

function tick(full) {
  const pct = !P.live && P.dur ? Math.min(100, P.pos / P.dur * 100) : (P.item ? 100 : 0);
  const sk = $('#seek');
  if (sk && document.activeElement !== sk) { sk.value = Math.round(P.pos); sk.style.setProperty('--p', pct + '%'); }
  const tp = $('#tPos'); if (tp) tp.textContent = fmt(P.pos);
  const td = $('#tDur'); if (td) td.textContent = P.live ? 'LIVE' : '-' + fmt(Math.max(0, P.dur - P.pos));
  const ot = $('#osdTime'); if (ot) ot.textContent = P.live ? 'LIVE' : fmt(P.pos) + ' / ' + fmt(P.dur);
  const ep = $('#eProg'); if (ep) ep.setAttribute('stroke-dasharray', `${P.item ? pct : 0} 100`);
  const mr = $('#miniRing'); if (mr) mr.setAttribute('stroke-dasharray', `${pct} 100`);
  const mt = $('#miniTime'); if (mt) mt.textContent = P.live ? 'LIVE' : fmt(P.pos) + ' / ' + fmt(P.dur);
  const cue = $('#cue');
  if (cue) {
    const c = P.subs && P.subs.find(c => P.pos >= c.a && P.pos <= c.z);
    cue.hidden = !c; if (c) cue.textContent = c.text;
    cue.style.fontSize = { Small: '12px', Medium: '15px', Large: '19px' }[S.settings.subSize];
  }
  if (full) {
    renderMini();
    const tb = $('.transport [data-act="toggle"]'); if (tb) { tb.innerHTML = icon(P.playing ? 'pause' : 'play'); tb.setAttribute('aria-label', P.playing ? 'Pause' : 'Play'); }
  }
}
function renderMini() {
  const m = $('#mini');
  const it = P.item;
  m.hidden = S.view === 'player' || S.view === 'mirror' || (!it && !M.stream);
  if (m.hidden) return;
  if (M.stream) {
    m.innerHTML = `<span class="round sm" style="color:var(--warm)">${icon('mirror')}</span><div class="meta" data-act="openMirror"><div class="t">Mirroring</div><div class="s"><span id="mMini">${fmt((Date.now() - M.at) / 1000)}</span></div></div>
      <button class="round sm" data-act="stopMirror" aria-label="Stop mirroring">${icon('stop')}</button>`;
    return;
  }
  m.innerHTML = `<div class="ring">${thumb(it)}<svg viewBox="0 0 50 50" aria-hidden="true"><rect id="miniRing" x="1.5" y="1.5" width="47" height="47" rx="14" pathLength="100" stroke-dasharray="0 100"/></svg></div>
    <div class="meta" data-act="openPlayer"><div class="t">${esc(it.title)}</div><div class="s"><span id="miniTime"></span><span>${esc(devName())}</span></div></div>
    <button class="round sm acc" data-act="toggle" aria-label="${P.playing ? 'Pause' : 'Play'}">${icon(P.playing ? 'pause' : 'play')}</button>
    ${S.queue.length ? `<button class="round sm" data-act="next" aria-label="Next">${icon('next')}</button>` : ''}`;
  tick();
}

function render() {
  if (video.parentNode !== document.body) document.body.appendChild(video);
  if (mvid.parentNode !== document.body) document.body.appendChild(mvid);
  main.innerHTML = S.view === 'home' ? homeView() : sectionView(S.view);
  if (S.view === 'home') { updateConn(); tick(); }
  if (S.view === 'player') renderScreen();
  if (S.view === 'mirror') renderMirrorScreen();
  placeYT();
  renderMini();
}

/* ---------- Screen picker ---------- */
const scrim = $('#scrim');
function closeSheet() {
  if (sheetKind === 'devices' && N.on) ncall('stopScan').catch(() => {});
  scrim.hidden = true; sheetKind = '';
}
function openDevices() {
  sheetKind = 'devices'; scrim.hidden = false;
  if (N.on) { N.scanning = true; ncall('scan').catch(e => { N.scanning = false; toast(e.message); drawDevices(); }); }
  drawDevices();
}
function drawDevices() {
  const list = deviceList(), found = list.filter(d => d.native).length;
  const status = N.on
    ? (N.scanning ? `Searching your Wi-Fi${found ? ` · ${found} found` : '…'}` : found ? `${found} screen${found > 1 ? 's' : ''} found` : 'No screens found')
    : 'Searching your Wi-Fi needs the Android app';
  const row = (id, ic, name, sub, on) => `<button class="dev ${on ? 'on' : ''}" data-dev="${esc(id)}"><span class="round">${icon(ic)}</span><span class="dm"><b>${esc(name)}</b><span>${esc(sub)}</span></span>${on ? '<span class="state">ON</span>' : ''}</button>`;
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Choose a screen"><div class="grab"></div>
    <header><span class="label grow">Cast to</span><button class="round sm" data-act="closeDev" aria-label="Close">${icon('x')}</button></header>
    <div class="scan"><span class="radar ${N.scanning ? 'on' : ''}"></span>${esc(status)}</div>
    ${list.map(d => row(d.id, d.icon, d.name, [d.kind, d.detail, d.demo && 'demo'].filter(Boolean).join(' · '), d.id === S.device)).join('')}
    ${row('local', 'phone', 'This device', 'Play here', S.device === 'local')}
    ${N.on && !N.scanning && !found ? `<div class="note sheet-note">The phone and the screen must be on the same Wi-Fi, and the screen must support Google Cast or DLNA. For a car screen, join the car’s Wi-Fi or connect the car to your phone’s hotspot.</div>` : ''}
    ${!N.on && isAndroid ? `<div class="note sheet-note">Get the StreamBeam app to find TVs and car screens on your Wi-Fi.<div class="acts"><a class="btn sm acc" href="https://github.com/elrity/streambeam/releases/latest" target="_blank" rel="noopener">Get the app</a></div></div>` : ''}
    <footer>${N.on ? `<button class="btn sm" data-act="rescan">${icon('refresh')}Search again</button>` : ''}<button class="btn sm" data-act="mirrorFromSheet">${icon('mirror')}Mirror</button>${S.device ? '<button class="btn sm flat" data-act="disconnect">Disconnect</button>' : ''}</footer></div>`;
}
function pickDevice(id) {
  const d = deviceList().find(x => x.id === id);
  if (nativeOn() && S.device !== id) { extCmd('stop'); P.ext = ''; P.playing = false; }
  S.device = id; S.deviceName = d?.name || ''; save(); closeSheet();
  if (id === 'remote') promptRemote();
  else if (id === 'vlc') vlcConnect().then(ok => { if (ok && P.item && canVlc(P.item.url)) playItem(P.item, { from: P.pos }); });
  else if (d?.native) {
    ncall('connect', { deviceId: id.slice(2) }).then(() => {
      toast('Connected to ' + d.name);
      if (P.item && castable(P.item.url)) playItem(P.item, { from: P.pos });
    }).catch(e => toast(e.message));
  } else toast(id === 'local' ? 'Playing on this device' : `Connected to ${d?.name}`);
  render();
}
scrim.addEventListener('click', e => {
  if (e.target === scrim) { closeSheet(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'closeDev') closeSheet();
  else if (act === 'rescan') openDevices();
  else if (act === 'vlcCopy') navigator.clipboard.writeText(vlcSheetItem.url).then(() => toast('Link copied'), () => toast('Copy blocked'));
  else if (act === 'vlcM3u') saveM3u([vlcSheetItem], vlcSheetItem.title);
  else if (act === 'vlcSend') { closeSheet(); S.device = 'vlc'; save(); if (canVlc(vlcSheetItem.url)) playItem(vlcSheetItem); else toast('VLC can’t open files from here'); }
  else if (act === 'mirrorFromSheet') { closeSheet(); go('mirror'); }
  else if (act === 'disconnect') {
    if (S.device.startsWith('n:')) { extCmd('stop'); ncall('disconnect').catch(() => {}); P.ext = ''; P.playing = false; }
    S.device = ''; S.deviceName = ''; save(); closeSheet(); toast('Disconnected'); render();
  }
  else if ('dev' in b.dataset) pickDevice(b.dataset.dev);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !scrim.hidden) { closeSheet(); return; }
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === ' ' && P.item) { e.preventDefault(); toggle(); }
  if (e.key === 'ArrowLeft') seek(P.pos - S.settings.skip);
  if (e.key === 'ArrowRight') seek(P.pos + S.settings.skip);
  if (e.key === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey) { go('today'); $('#askInput')?.focus(); e.preventDefault(); }
});

/* ---------- Events ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function setTheme(t, quiet) {
  const r = document.documentElement;
  if (t === 'dark') r.dataset.theme = 'dark'; else delete r.dataset.theme;
  if (!quiet) store.set('theme', t);
  const css = getComputedStyle(r), top = css.getPropertyValue('--bg-top').trim(), bottom = css.getPropertyValue('--bg-bottom').trim();
  $('meta[name="theme-color"]')?.setAttribute('content', top);
  if (N.on) ncall('theme', { dark: t === 'dark', top, bottom }).catch(() => {});
}
setTheme(store.get('theme', 'light'), true);
function findItem(row) {
  const list = row.closest('[data-list]')?.dataset.list; const id = row.dataset.id;
  const src = { detected: S.detected, queue: S.queue, local: S.local, history: S.history, bookmarks: S.bookmarks }[list] || [];
  return { list, arr: src, idx: src.findIndex(x => x.id === id), item: src.find(x => x.id === id) };
}
const RATES = [1, 1.25, 1.5, 2, .5, .75];

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-go],[data-site],[data-ch],[data-group],[data-ask],[data-copyask]');
  if (!b || scrim.contains(b)) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.ask) return ask(b.dataset.ask);
  if (b.dataset.copyask) {
    const t = TILES.find(x => x.id === b.dataset.copyask);
    navigator.clipboard.writeText(t.prompt()).then(() => toast('Question copied. Paste it in Gemini.'), () => toast('Ask Gemini: ' + t.label));
    return;
  }
  if (b.dataset.site) { const s = SITES.find(x => x.id === b.dataset.site); return browse(s.url); }
  if (b.dataset.ch) { const c = views._ch.find(x => x.id === b.dataset.ch); return c && playItem(c, { from: 0 }); }
  if (b.dataset.group) { S.group = b.dataset.group; return render(); }
  const act = b.dataset.act;
  const row = b.closest('.row'); const ctx = row ? findItem(row) : {};
  switch (act) {
    case 'home': goHome(); break;
    case 'cast': if (ctx.list === 'queue') { S.queue.splice(ctx.idx, 1); save(); } playItem(ctx.item, ctx.list === 'history' ? { from: ctx.item.pos > 5 ? ctx.item.pos : 0 } : {}); break;
    case 'enqueue': S.queue.push({ ...ctx.item, id: uid() }); save(); toast(`Queued · ${S.queue.length}`); render(); break;
    case 'queueAll': S.detected.forEach(m => S.queue.push({ ...m, id: uid() })); save(); toast(`Queued ${S.detected.length}`); render(); break;
    case 'remove': S.queue.splice(ctx.idx, 1); save(); render(); break;
    case 'up': { const j = ctx.idx - 1; [S.queue[ctx.idx], S.queue[j]] = [S.queue[j], S.queue[ctx.idx]]; save(); render(); break; }
    case 'clearQueue': S.queue = []; save(); render(); break;
    case 'clearHistory': S.history = []; save(); render(); break;
    case 'libTab': S.libTab = b.dataset.tab; render(); break;
    case 'toggle': toggle(); break;
    case 'back': seek(P.pos - S.settings.skip); break;
    case 'fwd': seek(P.pos + S.settings.skip); break;
    case 'stop': stop(); break;
    case 'next': next(); break;
    case 'rate': {
      P.rate = RATES[(RATES.indexOf(P.rate) + 1) % RATES.length];
      video.playbackRate = P.rate; if (ytOn()) Y.player.setPlaybackRate(P.rate); extCmd('rate', P.rate);
      b.innerHTML = `<span class="mono">${P.rate}×</span>`; break;
    }
    case 'mute': P.muted = !P.muted; video.muted = P.muted; if (ytOn()) P.muted ? Y.player.mute() : Y.player.unMute(); extCmd('volume', P.muted ? 0 : P.vol); render(); break;
    case 'vlc': openVlcSheet(ctx.item || P.item); break;
    case 'openToday': go('today'); break;
    case 'geminiSetup': go('settings'); $('#s-geminiKey')?.focus(); break;
    case 'locate': locate(); break;
    case 'speak': speak(); break;
    case 'copyAnswer': try { await navigator.clipboard.writeText(GM.answer.text); toast('Copied'); } catch { toast('Copy blocked'); } break;
    case 'vlcConnect': S.settings.vlcBridge = ($('#vlcBridge')?.value || '').trim(); save(); vlcConnect(); break;
    case 'vlcUse': S.device = 'vlc'; save(); if (P.item) playItem(P.item, { from: P.pos }); else vlcConnect(); break;
    case 'queueM3u': saveM3u(S.queue, 'StreamBeam queue'); break;
    case 'ytMirror': M.surface = 'browser'; saveMirror(); go('mirror'); break;
    case 'ytCopy': try { await navigator.clipboard.writeText(ytLink()); toast('Link copied'); } catch { toast('Copy blocked'); } break;
    case 'subs': if (P.subName) { P.subs = null; P.subName = ''; render(); } else $('#subFile').click(); break;
    case 'devices': openDevices(); break;
    case 'openPlayer': go('player'); break;
    case 'openMirror': go('mirror'); break;
    case 'startMirror': startMirror(); break;
    case 'stopMirror': stopMirror(); break;
    case 'nativeMirror': ncall('openCastSettings').catch(err => toast(err.message)); break;
    case 'bookmark': {
      const i = S.bookmarks.findIndex(x => x.url === S.url);
      if (i >= 0) { S.bookmarks.splice(i, 1); toast('Bookmark removed'); }
      else { let t; try { t = new URL(S.url).hostname.replace(/^www\./, ''); } catch { t = S.url; } S.bookmarks.unshift({ id: uid(), title: SITES.find(s => s.url === S.url)?.name || t, url: S.url }); toast('Bookmarked'); }
      save(); render(); break;
    }
    case 'unbookmark': S.bookmarks.splice(ctx.idx, 1); save(); render(); break;
    case 'openBm': go('browser'); browse(ctx.item.url); break;
    case 'm3uApply': S.m3u = $('#m3uText').value; S.group = 'All'; save(); toast(`${parseM3U(S.m3u).length} channels`); render(); break;
    case 'm3uSample': S.m3u = SAMPLE_M3U; S.group = 'All'; save(); render(); break;
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'urlForm') { e.preventDefault(); browse($('#urlInput').value); }
  if (e.target.id === 'askForm') {
    e.preventDefault(); const q = $('#askInput').value.trim(); if (!q) return;
    if (geminiReady()) ask(null, q);
    else { navigator.clipboard.writeText(q).catch(() => {}); GM.err = ''; toast('Question copied. Opening Gemini.'); const a = document.createElement('a'); a.href = 'https://gemini.google.com/app'; a.target = '_blank'; a.rel = 'noopener'; a.click(); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'seek') { t.style.setProperty('--p', (t.value / t.max * 100) + '%'); $('#tPos').textContent = fmt(+t.value); }
  if (t.id === 'vol') {
    P.vol = t.value / 100; P.muted = P.vol === 0; video.volume = P.vol; video.muted = P.muted;
    if (ytOn()) { Y.player.setVolume(+t.value); P.muted ? Y.player.mute() : Y.player.unMute(); }
    clearTimeout(V.volT); V.volT = setTimeout(() => extCmd('volume', P.vol), 150);
    t.style.setProperty('--p', t.value + '%');
  }
  if (t.id === 'chSearch') { S.chSearch = t.value; const pos = t.selectionStart; render(); const n = $('#chSearch'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'seek') seek(+t.value);
  if (t.id?.startsWith('m-')) {
    const k = t.id.slice(2);
    M[k] = t.type === 'checkbox' ? t.checked : (k === 'fps' ? +t.value : t.value);
    saveMirror();
  }
  if (t.id?.startsWith('s-')) {
    const k = t.id.slice(2);
    S.settings[k] = t.type === 'checkbox' ? t.checked : k === 'skip' ? +t.value : k === 'units' ? { '°C': 'C', '°F': 'F' }[t.value] || '' : k === 'region' ? t.value.trim().toUpperCase() : ['vlcBridge', 'geminiKey', 'geminiModel'].includes(k) ? t.value.trim() : t.value;
    if (k === 'vlcBridge') V.ok = false;
    if (k === 'theme') { setTheme(t.value === 'Dark' ? 'dark' : 'light'); return; }
    if (k === 'emblem') S.settings.emblem = t.value.toLowerCase();
    if (k === 'demo' && !t.checked && S.device.startsWith('demo-')) S.device = '';
    save(); toast('Saved');
  }
  if (t.id === 'fileIn') addFiles(t.files);
  if (t.id === 'tCity') { S.settings.city = t.value.trim(); save(); }
  if (t.id === 'm3uFile' && t.files[0]) { $('#m3uText').value = await t.files[0].text(); }
});
function addFiles(files) {
  [...files].forEach(f => {
    const url = URL.createObjectURL(f);
    S.local.push({ id: uid(), title: f.name.replace(/\.[^.]+$/, ''), fileName: f.name, url, res: '', size: (f.size / 1048576).toFixed(1) + ' MB', duration: 0 });
  });
  render();
}
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest?.('#drop'); if (!d) return;
  e.preventDefault(); d.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
}));

/* ---------- Boot ---------- */
if (S.device.startsWith('n:') && !N.on) { S.device = ''; S.deviceName = ''; }
{
  /* Home-screen shortcuts open ?go=<tile|section>; #<section> links work too. Back from a section returns home. */
  let goTo = new URLSearchParams(location.search).get('go') || location.hash.slice(1);
  if (goTo === 'history' || goTo === 'bookmarks') { S.libTab = goTo; goTo = 'library'; }
  try { history.replaceState({ sb: 'home' }, '', location.pathname); } catch {}
  render();
  if (TILES.some(t => t.id === goTo)) { go('today'); geminiStatus().then(() => ask(goTo)); }
  else { if (goTo in TITLES) go(goTo); geminiStatus(); }
}
if (S.device === 'vlc') vlcConnect(true);
if (N.on && S.device.startsWith('n:')) ncall('scan', { quiet: true }).catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<!-- APP-END -->
</body>
