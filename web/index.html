<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StreamBeam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- APP-START -->
<title>StreamBeam Video Caster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
/* Layout: app shell — top bar, left nav rail (bottom tabs on phones), main pane, persistent cast mini-remote at the bottom. Dark-first like a living-room remote. */
:root {
  --bg: #0d1117; --panel: #151b24; --panel-2: #1c2430; --line: #2a3443;
  --fg: #e9edf3; --muted: #8d98aa; --accent: #ff8a3d; --accent-ink: #1b0d03;
  --accent-soft: rgba(255,138,61,.14); --ok: #3ccf91; --warn: #f2c14e; --bad: #ff5d6c;
  --tv: #05070a; --shadow: 0 18px 50px rgba(0,0,0,.45);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f4f7; --panel: #ffffff; --panel-2: #eaeef3; --line: #d5dce6;
  --fg: #121820; --muted: #566175; --accent: #d25a0b; --accent-ink: #ffffff;
  --accent-soft: rgba(210,90,11,.10); --ok: #138a5a; --warn: #a77700; --bad: #c8283a;
  --tv: #0b0e13; --shadow: 0 18px 40px rgba(20,30,45,.16); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f4f7; --panel: #ffffff; --panel-2: #eaeef3; --line: #d5dce6;
  --fg: #121820; --muted: #566175; --accent: #d25a0b; --accent-ink: #ffffff;
  --accent-soft: rgba(210,90,11,.10); --ok: #138a5a; --warn: #a77700; --bad: #c8283a;
  --tv: #0b0e13; --shadow: 0 18px 40px rgba(20,30,45,.16); color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { height: 100%; display: grid; grid-template-columns: 216px minmax(0,1fr); grid-template-rows: auto minmax(0,1fr) auto; grid-template-areas: "top top" "nav main" "mini mini"; }

/* Top bar */
.top { grid-area: top; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { flex: none; display: flex; align-items: center; gap: 10px; font: 800 19px/1 var(--f-display); letter-spacing: -.01em; white-space: nowrap; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand .mark svg { width: 18px; height: 18px; stroke-width: 2.2; }
.top .spacer { flex: 1; }
.cast-btn { min-width: 0; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 14px; max-width: 50vw; }
.cast-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cast-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; border: 1px solid transparent; background: transparent; }
.icon-btn:hover { background: var(--panel-2); }

/* Nav */
.nav { grid-area: nav; border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; text-align: left; }
.nav button:hover { color: var(--fg); background: var(--panel-2); }
.nav button[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .badge { margin-left: auto; font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }

/* Main */
.main { grid-area: main; overflow-y: auto; padding-block: 22px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.view-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.view-head h1 { margin: 0; font: 800 clamp(24px, 3.4vw, 32px)/1.1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.view-head .grow { flex: 1; min-width: 0; }
.eyebrow { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h h2 { margin: 0; font: 700 15px/1.2 var(--f-body); }
.panel-h .grow { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--panel-2); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn svg.i { width: 17px; height: 17px; }

/* Browser */
.urlbar { display: flex; gap: 8px; padding: 10px; align-items: center; }
.urlbar .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 42px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.urlbar .field:focus-within { border-color: var(--accent); }
.urlbar input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--f-mono); font-size: 13px; }
.urlbar .star.on { color: var(--warn); }
.urlbar .star.on svg { fill: currentColor; }
.notice { margin: 0 10px 10px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; background: var(--panel-2); border-left: 3px solid var(--warn); }
.notice.ok { border-left-color: var(--ok); }

.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.site { text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.site:hover { border-color: var(--accent); }
.site b { font: 700 15px/1.25 var(--f-body); }
.site small { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; overflow-wrap: anywhere; }
.site span { color: var(--muted); font-size: 13px; }

/* Media rows */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 84px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.list > .row:first-child { border-top: 0; }
.row.playing { background: var(--accent-soft); }
.thumb { width: 84px; aspect-ratio: 16/9; max-width: 100%; border-radius: 6px; position: relative; overflow: hidden; display: grid; place-items: center; color: rgba(255,255,255,.92); font: 800 13px/1 var(--f-display); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.thumb .dur { position: absolute; right: 4px; bottom: 4px; padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,.72); color: #fff; font: 600 10px/1.3 var(--f-mono); text-shadow: none; }
.meta { min-width: 0; }
.meta .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .s { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.meta .u { font: 11.5px/1.3 var(--f-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font: 600 10.5px/1.4 var(--f-mono); letter-spacing: .04em; border: 1px solid var(--line); color: var(--muted); }
.chip.fmt-MP4 { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.chip.fmt-HLS { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.chip.fmt-YOUTUBE { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.chip.fmt-DASH, .chip.fmt-MKV { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.live { color: #fff; background: var(--bad); border-color: var(--bad); }
.actions { display: flex; gap: 6px; align-items: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }

/* Now playing */
.np { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.tv { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.screen { position: relative; aspect-ratio: 16/9; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--tv); }
.screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; }
.screen .poster { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 6%; color: #fff; }
.screen .poster h3 { margin: 0; font: 800 clamp(20px, 3.6vw, 40px)/1.05 var(--f-display); letter-spacing: -.02em; text-shadow: 0 2px 12px rgba(0,0,0,.4); text-wrap: balance; }
.screen .poster p { margin: 6px 0 0; font: 500 12px/1.4 var(--f-mono); opacity: .85; }
.screen .osd { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 10px 12px; font: 600 11px/1 var(--f-mono); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.screen .osd .rec { display: inline-flex; gap: 6px; align-items: center; }
.screen .osd .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(60,207,145,.25); }
.screen .cue { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); max-width: 86%; text-align: center; padding: 3px 8px; border-radius: 3px; background: rgba(0,0,0,.72); color: #fff; font-weight: 600; }
.screen .pause-ind { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.screen .pause-ind span { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.5); display: grid; place-items: center; color: #fff; }
.screen .pause-ind svg { width: 30px; height: 30px; }
.tv-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 4px 0; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.screen.idle .poster { justify-content: center; align-items: center; text-align: center; }

.remote { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.remote .title { font: 800 20px/1.2 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.seek { display: flex; flex-direction: column; gap: 4px; }
.seek .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5.5px; border-radius: 50%; background: var(--fg); border: 0; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 0; }
.transport { display: flex; justify-content: center; align-items: center; gap: 10px; }
.transport .icon-btn { width: 46px; height: 46px; border-color: var(--line); background: var(--panel-2); }
.transport .icon-btn { position: relative; }
.transport .big { width: 64px; height: 64px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.transport .big svg { width: 26px; height: 26px; }
.transport .big:hover { background: var(--accent); filter: brightness(1.06); }
.knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.knob { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); }
.knob label { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.knob select { border: 0; background: transparent; font-weight: 600; padding: 0; outline: none; }
.knob select option { background: var(--panel); }
.knob.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 10px; }
.knob.wide label { flex: none; }

/* Queue */
.qnum { font: 600 12px/1 var(--f-mono); color: var(--muted); width: 22px; text-align: right; }
.row.q { grid-template-columns: 22px 84px minmax(0,1fr) auto; }

/* Local */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 28px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--panel); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg.i { width: 34px; height: 34px; color: var(--accent); }

/* IPTV */
.iptv-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.search { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 38px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; padding: 16px; }
.ch { text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.ch:hover { border-color: var(--accent); }
.ch .thumb { width: 100%; border-radius: 0; font-size: 17px; }
.ch .cm { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ch .cm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch .cm span { font: 11px/1.3 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
textarea { width: 100%; min-height: 140px; resize: vertical; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font: 12.5px/1.5 var(--f-mono); }
details.import { border-top: 1px solid var(--line); }
details.import summary { padding: 12px 16px; cursor: pointer; font-weight: 600; }
details.import .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }

/* Settings */
.set { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.set:first-of-type { border-top: 0; }
.set b { display: block; }
.set span { color: var(--muted); font-size: 13.5px; }
.set select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* YouTube player: one persistent iframe host laid over the TV screen (moving an iframe reloads it) */
#ytHost { position: fixed; z-index: 5; left: -9999px; top: 0; width: 320px; height: 180px; visibility: hidden; border-radius: 6px; overflow: hidden; background: #000; }
#ytHost iframe { width: 100%; height: 100%; border: 0; display: block; }
.top, .nav { position: relative; z-index: 6; }
.yt-tv { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.yt-tv h2 { margin: 0; font: 700 15px/1.3 var(--f-body); }
.yt-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.yt-opts > div { padding: 12px 14px; border-radius: 8px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); min-width: 0; }
.yt-opts b { color: var(--fg); font-size: 14px; }
.yt-opts .btn { align-self: flex-start; }
a.btn { text-decoration: none; }

/* Today (Gemini quick access) */
.gem-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 14px; }
.gem-btn svg.i { color: var(--accent); }
.gem-btn:hover { background: var(--panel-2); }
.ask { display: flex; gap: 8px; padding: 10px; }
.ask .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 46px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.ask .field:focus-within { border-color: var(--accent); }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; }
.ask .field svg.i { color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); text-align: left; text-decoration: none; color: var(--fg); min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile[aria-busy="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tile svg.i { width: 24px; height: 24px; color: var(--accent); margin-bottom: 4px; }
.tile b { font-size: 15px; }
.tile span { font-size: 12.5px; color: var(--muted); }
.answer { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.answer .md { font-size: 15px; line-height: 1.6; max-width: 70ch; overflow-wrap: anywhere; }
.answer .md h3 { margin: 10px 0 4px; font: 700 16px/1.3 var(--f-body); }
.answer .md ul { margin: 4px 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.answer .md p { margin: 4px 0; }
.answer .md a, .sources a { color: var(--accent); }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.sources a { font: 12px/1.4 var(--f-mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.loading i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.mode .dot { display: inline-block; vertical-align: middle; margin-right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.mode .dot.on { background: var(--ok); }
.where { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.where input { width: 180px; max-width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }

/* VLC */
.chip.vlc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.vlc-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 13.5px; }
.vlc-steps b { color: var(--fg); font-weight: 600; }
.vlc-steps code, .sheet code { font: 12px/1.5 var(--f-mono); padding: 1px 5px; border-radius: 4px; background: var(--panel-2); color: var(--fg); overflow-wrap: anywhere; }
.bridge { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bridge input { flex: 1; min-width: 200px; height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font: 13px var(--f-mono); }
.sheet .opt { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.sheet .opt b { color: var(--fg); font-size: 14.5px; }
.sheet .opt .actions { flex-wrap: wrap; }

/* Mirror */
.mirror { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.screen video.mv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.mirror-idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6%; text-align: center; color: #c9d2df; background: radial-gradient(circle at 50% 40%, #1d2633, #05070a 70%); }
.mirror-idle svg.i { width: 40px; height: 40px; color: #8d98aa; }
.mirror-idle b { color: #fff; font: 700 17px/1.3 var(--f-body); }
.mirror-idle span { font-size: 13px; max-width: 40ch; }
.rec-dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--bad); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }
.status { display: inline-flex; align-items: center; gap: 8px; font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.status.live { color: var(--bad); }
.status.ready { color: var(--muted); }
.notice.bad { border-left-color: var(--bad); }
.guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.guide article { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.guide article.yours { border-color: var(--accent); }
.guide h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 700 15px/1.3 var(--f-body); }
.guide h3 .chip { margin-left: auto; color: var(--accent); border-color: var(--accent); }
.guide ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13.5px; }
.guide ol b { color: var(--fg); font-weight: 600; }
.guide .works { font: 11.5px/1.45 var(--f-mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
kbd { font: 600 11.5px/1 var(--f-mono); padding: 2px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); color: var(--fg); }

/* Mini remote */
.mini { grid-area: mini; z-index: 6; display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--panel); position: relative; }
.mini .bar { position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: var(--line); }
.mini .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.mini .thumb { width: 64px; cursor: pointer; }
.mini .thumb .dur { display: none; }
.mini .meta { flex: 1; cursor: pointer; }
.mini .meta .s { margin-top: 1px; }
.mini .ctl { display: flex; gap: 4px; align-items: center; }
.mini .ctl .play { background: var(--accent); color: var(--accent-ink); }
.mini .ctl .play:hover { background: var(--accent); filter: brightness(1.06); }

/* Device sheet */
.scrim { position: fixed; inset: 0; background: rgba(5,8,12,.55); display: grid; place-items: center; padding: 16px; z-index: 40; }
.sheet { width: min(460px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
.sheet header h2 { margin: 0; font: 800 20px/1.2 var(--f-display); flex: 1; }
.scan { display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; color: var(--muted); font-size: 13px; }
.radar { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); position: relative; }
.radar.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.2s ease-out infinite; }
@keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
.dev { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.dev:hover { background: var(--panel-2); }
.dev .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; flex: none; }
.dev.on .ico { background: var(--accent); color: var(--accent-ink); }
.dev .dm { flex: 1; min-width: 0; }
.dev .dm b { display: block; }
.dev .dm span { font-size: 12.5px; color: var(--muted); }
.dev .state { font: 600 11px/1 var(--f-mono); color: var(--accent); }
.sheet footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; padding: 10px 16px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .np, .mirror { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 760px) {
  .gem-btn span { display: none; }
  .app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr) auto auto; grid-template-areas: "top" "main" "mini" "nav"; }
  .nav { flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); overflow-x: auto; gap: 0; }
  .nav button { flex-direction: column; gap: 3px; padding: 6px 10px; font-size: 11px; flex: 1 0 auto; }
  .nav .badge, .nav .sep { display: none; }
  .brand .name-long { display: none; }
  .row { grid-template-columns: 64px minmax(0,1fr); }
  .row .thumb { width: 64px; }
  .row .actions { grid-column: 1 / -1; justify-content: flex-end; }
  .row.q { grid-template-columns: 18px 64px minmax(0,1fr); }
  .mini .ctl .hide-sm { display: none; }
  .mini .thumb { display: none; }
  .toast { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 430px) { .cast-btn span { display: none; } .cast-btn { padding: 8px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
};
const hue = str => { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const poster = title => { const h = hue(title); return `background: linear-gradient(135deg, hsl(${h} 62% 38%), hsl(${(h + 48) % 360} 70% 22%) 60%, hsl(${(h + 96) % 360} 55% 14%));`; };
const initials = t => String(t).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '▶';
/* YouTube links: watch, youtu.be, shorts, live, embed, playlists, music and mobile hosts */
const ytTime = t => { if (!t) return 0; if (/^\d+$/.test(t)) return +t; const m = String(t).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0; };
function ytParse(u) {
  let x; try { x = new URL(u); } catch { return null; }
  const h = x.hostname.replace(/^(www|m|music)\./, '');
  let id = null;
  if (h === 'youtu.be') id = x.pathname.slice(1).split('/')[0];
  else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
    id = x.searchParams.get('v');
    const m = x.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/); if (m) id = m[1];
  } else return null;
  if (id && !/^[\w-]{11}$/.test(id)) id = null;
  const list = x.searchParams.get('list');
  if (!id && !list) return null;

  if (!P.item || !P.playing) return;
  if (P.real) { P.pos = video.currentTime; }
  else if (ytOn()) { P.pos = Y.player.getCurrentTime() || 0; const d = Y.player.getDuration(); if (d && !P.live) P.dur = d; }
  else if (P.yt && P.ytState !== 'blocked') { /* waiting on YouTube */ }
  else if (vlcOn()) { if (V.ok) P.pos = Math.min(P.dur || Infinity, P.pos + .25 * P.rate); }

/* Subtitles (SRT/VTT parsed into cues; rendered on the TV screen) */
function parseSubs(text) {
  const toS = t => { const m = t.trim().replace(',', '.').match(/(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)/); return m ? (+m[1] || 0) * 3600 + +m[2] * 60 + +m[3] : 0; };
  return text.replace(/\r/g, '').split(/\n\n+/).map(b => {
    const lines = b.split('\n'); const i = lines.findIndex(l => l.includes('-->'));
    if (i < 0) return null;
    const [a, z] = lines[i].split('-->');
    return { a: toS(a), z: toS(z.split(' ').filter(Boolean)[0] || z), text: lines.slice(i + 1).join('\n').replace(/<[^>]+>/g, '') };
  }).filter(Boolean);
}
$('#subFile').addEventListener('change', async e => {

async function startMirror() {
  M.error = null;

      audio: M.audio, selfBrowserSurface: 'exclude', surfaceSwitching: 'include', systemAudio: 'include'

    if (P.item) { logHistory(); P.playing = false; if (P.real) video.pause(); }

}

}

async function geminiStatus() {

const geminiReady = () => GM.server || !!S.settings.geminiKey;
function parseGemini(j) {
  const c = j.candidates?.[0];
  const text = (c?.content?.parts || []).map(p => p.text || '').join('').trim();
  const sources = (c?.groundingMetadata?.groundingChunks || []).map(x => x.web).filter(w => w && w.uri).map(w => ({ title: w.title || new URL(w.uri).hostname, uri: w.uri }));
  if (!text) throw new Error(c?.finishReason === 'SAFETY' ? 'Gemini declined to answer that.' : 'Gemini returned no answer. Try again.');
  return { text, sources };
}
async function gemini(prompt) {
  if (GM.server) {
    const r = await fetch('gemini', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'The server couldn’t reach Gemini (' + r.status + ').');
    return j;
  }
  const model = (S.settings.geminiModel || 'gemini-2.5-flash').trim();
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.settings.geminiKey.trim() },
    body: JSON.stringify({ systemInstruction: { parts: [{ text: SYSTEM }] }, contents: [{ role: 'user', parts: [{ text: prompt }] }], tools: [{ google_search: {} }] })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = j.error?.message || '';
    throw new Error(r.status === 400 && /API key/i.test(m) ? 'Gemini rejected the API key. Check it in Settings.' : r.status === 429 ? 'Gemini’s quota for this key is used up. Try again later.' : r.status === 404 ? `Gemini doesn’t know the model “${model}”. Change it in Settings.` : m || 'Gemini answered ' + r.status + '.');
  }

}

function md(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
  let html = '', list = false;
  text.split('\n').forEach(l => {
    const li = l.match(/^\s*[-*•]\s+(.*)/), h = l.match(/^#{1,4}\s+(.*)/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; return; }
    if (list) { html += '</ul>'; list = false; }
    if (h) html += `<h3>${inline(h[1])}</h3>`;
    else if (l.trim()) html += `<p>${inline(l)}</p>`;

  return html + (list ? '</ul>' : '');
}

/* ---------- Sniffer ---------- */
const MEDIA_RE = /(?:https?:)?\/\/[^\s"'<>()]+?\.(?:mp4|m4v|webm|mov|mkv|avi|flv|wmv|ts|m3u8|mpd|mp3|m4a)(?:\?[^\s"'<>()]*)?/gi;
async function browse(raw) {
  let url = raw.trim(); if (!url) return;
  if (!/^[a-z]+:/i.test(url)) url = (/\s/.test(url) || !/\./.test(url)) ? 'https://duckduckgo.com/?q=' + encodeURIComponent(url) : 'https://' + url;
  S.url = url; S.notice = null;
  const site = SITES.find(s => s.url === url);
  if (site) { S.detected = site.media.map(m => ({ ...m, id: uid(), source: site.name })); S.notice = { ok: true, text: site.id === 'youtube' ? 'Paste a YouTube link above, or cast one of these.' : `Found ${site.media.length} videos on this page.` }; return render(); }
  if (ytParse(url)) {
    const it = ytItem(url); S.detected = [it];
    S.notice = { ok: true, text: ytParse(url).id ? 'YouTube video. Ready to cast.' : 'YouTube playlist. Ready to cast.' };
    render(); ytTitle(it); return;
  }
  if (/(^|\.)(youtube\.com|youtu\.be)$/i.test(new URL(url).hostname)) {
    S.detected = []; S.notice = { text: 'Open a video on YouTube, tap Share → Copy link, and paste the link here.', link: url }; return render();
  }
  if (fmtOf(url) !== 'MP4' || /\.(mp4|m4v)(\?|$)/i.test(url)) {
    if (/\.(mp4|m4v|webm|mov|mkv|avi|flv|wmv|ts|m3u8|mpd|mp3|m4a)(\?|$)/i.test(url)) {
      const name = decodeURIComponent(url.split('?')[0].split('/').pop()).replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
      S.detected = [{ id: uid(), title: name || 'Video', url, res: fmtOf(url) === 'HLS' ? 'Auto' : '—', size: '—', duration: 0, source: 'Direct link' }];
      S.notice = { ok: true, text: 'Direct video link. Ready to cast.' };
      return render();
    }
  }
  S.notice = { ok: true, text: 'Scanning page for videos…' }; render();
  try {
    const res = await fetch(url, { mode: 'cors' });
    const html = await res.text();
    const found = new Map();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('video[src], source[src], a[href]').forEach(el => {
      const v = el.getAttribute('src') || el.getAttribute('href');
      if (el.tagName !== 'A' || /\.(mp4|m4v|webm|mov|mkv|m3u8|mpd)(\?|$)/i.test(v)) { try { found.set(new URL(v, url).href, el.closest('video')?.getAttribute('title') || ''); } catch {} }
    });
    (html.match(/(?:youtube(?:-nocookie)?\.com\/(?:embed\/|watch\?v=|shorts\/)|youtu\.be\/)[\w-]{11}/g) || []).forEach(m => { const it = ytItem('https://' + m.replace(/^/, m.startsWith('youtu.be') ? '' : 'www.')); if (!found.has(it.url)) found.set(it.url, ''); });
    (html.match(MEDIA_RE) || []).forEach(m => { try { const h = new URL(m.startsWith('//') ? 'https:' + m : m).href; if (!found.has(h)) found.set(h, ''); } catch {} });
    S.detected = [...found].map(([u, t]) => ytParse(u) ? ytItem(u, t) : ({ id: uid(), url: u, title: t || decodeURIComponent(u.split('?')[0].split('/').pop()), res: '—', size: '—', duration: 0, source: new URL(url).hostname }));
    S.detected.filter(m => ytParse(m.url)).forEach(ytTitle);
    S.notice = S.detected.length ? { ok: true, text: `Found ${S.detected.length} video${S.detected.length > 1 ? 's' : ''} on this page.` } : { text: 'No videos found on this page. Start the video on the site first, or paste its direct link (.mp4, .m3u8, .mpd).' };
  } catch {
    S.detected = [];
    S.notice = { text: 'This site doesn’t allow scanning from a web app. Open it, copy the video’s direct link (.mp4 or .m3u8) and paste it here.', link: url };
  }
  render();
}

/* ---------- M3U ---------- */
function parseM3U(text) {
  const out = []; let cur = null;
  text.replace(/\r/g, '').split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (l.startsWith('#EXTINF')) {
      const attr = k => (l.match(new RegExp(k + '="([^"]*)"')) || [])[1] || '';
      cur = { title: l.slice(l.lastIndexOf(',') + 1).trim() || 'Channel', group: attr('group-title') || 'Other', logo: attr('tvg-logo') };
    } else if (!l.startsWith('#')) {
      if (ytParse(l)) l = ytUrl(ytParse(l));
      out.push({ id: uid(), ...(cur || { title: l.split('/').pop(), group: 'Other' }), url: l, live: fmtOf(l) === 'HLS' || fmtOf(l) === 'DASH', res: 'Live', size: '—', duration: 0 });
      cur = null;
    }
  });
  return out;
}

    const a = GM.answer;
    return `<div class="view-head"><div class="grow"><div class="eyebrow">${esc(todayStr())}</div><h1>Today</h1>
      <p>News, weather and more from Gemini, one tap away.</p></div></div>
    <form class="panel" id="askForm" autocomplete="off"><div class="ask">
      <div class="field">${icon('spark')}<input id="askInput" placeholder="Ask Gemini anything" aria-label="Ask Gemini"></div>
      <button class="btn primary" type="submit">Ask</button></div></form>
    <div class="mode"><span style="flex:1 1 260px;min-width:0"><span class="dot ${ready ? 'on' : ''}"></span> ${ready
      ? `Answers show here, from Gemini with Google Search${GM.server ? ' (server key)' : ' (your API key)'}.`
      : 'Tiles copy a ready-made question and open Gemini, so you just paste. To get answers right here, add a Gemini API key.'}</span>
      ${ready ? '' : '<button class="btn ghost sm" data-act="geminiSetup">Add API key</button>'}
      <span class="where">${icon('pin')}<input id="tCity" value="${esc(S.settings.city)}" placeholder="${GM.loc ? 'Using your location' : 'Your city'}" aria-label="Your city"><button class="btn ghost sm" data-act="locate">Use my location</button></span></div>
    <div class="tiles">${TILES.map(tile).join('')}</div>
    ${GM.err ? `<div class="notice bad" style="margin:0">${esc(GM.err)}</div>` : ''}
    ${a ? `<section class="panel answer" aria-live="polite">
      <div class="view-head"><div class="grow"><div class="eyebrow">Gemini${a.at ? ' · ' + new Date(a.at).toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' }) : ''}</div><h2 style="margin:2px 0 0;font:800 20px/1.2 var(--f-display)">${esc(a.label)}</h2></div>
        ${a.text ? `<button class="btn sm" data-act="speak">${icon('speak')}Read aloud</button><button class="btn ghost sm" data-act="copyAnswer">${icon('copy')}Copy</button>` : ''}</div>
      ${a.text ? `<div class="md">${md(a.text)}</div>` : '<div class="loading"><i></i>Asking Gemini…</div>'}
      ${a.sources?.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Sources</div><div class="sources">${a.sources.slice(0, 8).map(x => `<a href="${esc(x.uri)}" target="_blank" rel="noopener" title="${esc(x.title)}">${esc(x.title)}</a>`).join('')}</div></div>` : ''}
    </section>` : ''}`;
  },

  browser() {
    const bm = S.bookmarks.some(b => b.url === S.url);
    return `<div class="view-head"><div class="grow"><div class="eyebrow">Web browser</div><h1>Find a video, send it to the TV</h1>
      <p>Open a page or paste a link. Videos on the page show up below, ready to cast.</p></div></div>
    <form class="panel" id="urlForm" autocomplete="off">
      <div class="urlbar">
        <div class="field">${icon('globe')}<input id="urlInput" name="url" value="${esc(S.url)}" placeholder="Search or enter a web address" aria-label="Web address"></div>
        <button type="button" class="icon-btn star ${bm ? 'on' : ''}" data-act="bookmark" title="${bm ? 'Remove bookmark' : 'Bookmark this page'}" aria-label="Bookmark">${icon('star')}</button>
        <button class="btn primary" type="submit">Go</button>
      </div>
      ${S.notice ? `<div class="notice ${S.notice.ok ? 'ok' : ''}">${esc(S.notice.text)}${S.notice.link ? ` <a href="${esc(S.notice.link)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Open site ↗</a>` : ''}</div>` : ''}
    </form>
    <section class="panel"><div class="panel-h"><h2>Videos on this page</h2><span class="chip">${S.detected.length}</span><div class="grow"></div>
      ${S.detected.length > 1 ? '<button class="btn ghost sm" data-act="queueAll">' + icon('list') + 'Queue all</button>' : ''}</div>
      <div class="list" data-list="detected">${S.detected.length ? S.detected.map(m => mediaRow(m, A.copy + A.vlc + A.queue + A.cast)).join('') : '<div class="empty"><b>No videos yet</b>Open a page or paste a direct link.</div>'}</div></section>
    <section><div class="eyebrow" style="margin-bottom:10px">Start page</div><div class="sites">
      ${SITES.map(s => `<button class="site" data-site="${s.id}"><b>${esc(s.name)}</b><span>${esc(s.blurb)}</span><small>${esc(s.url)}</small></button>`).join('')}
    </div></section>`;
  },

  player() {
    const it = P.item;
    const dev = DEVICES.find(d => d.id === S.device);
    const pct = !P.live && P.dur ? P.pos / P.dur * 100 : 0;
    return `<div class="view-head"><div class="grow"><div class="eyebrow">${dev ? 'Casting to ' + esc(dev.name) : 'Not connected'}</div><h1>Remote</h1></div>
      <button class="btn" data-act="devices">${icon('cast')}${dev ? 'Change screen' : 'Connect'}</button></div>
    ${M.stream ? `<div class="notice bad" style="margin:0">Your screen is being mirrored. Playing a video stops the mirror. <button class="btn ghost sm" data-act="openMirror">Go to mirroring</button></div>` : ''}
    ${P.yt ? ytNotice() : ''}${vlcPanel()}
    <div class="np">
      <div class="tv"><div class="screen ${it ? '' : 'idle'}" id="screen"></div>
        <div class="tv-foot"><span>${dev ? icon(dev.icon) + ' ' + esc(dev.kind) : 'No screen connected'}</span><span class="mono" id="srcState"></span></div></div>
      <div class="panel remote">
        <div><div class="eyebrow">${it ? (P.live ? 'Live channel' : 'Now playing') : 'Idle'}</div>
          <div class="title">${it ? esc(it.title) : 'Nothing playing'}</div>
          ${it ? `<div class="meta"><div class="s"><span class="chip fmt-${fmtOf(it.url)}">${fmtOf(it.url)}</span>${it.res && it.res !== '—' ? `<span>${esc(it.res)}</span>` : ''}${P.subName ? `<span>· CC ${esc(P.subName)}</span>` : ''}</div></div>` : '<p class="muted" style="margin:6px 0 0">Pick a video in the Browser, Queue, Local files or IPTV.</p>'}
        </div>
        <div class="seek">
          <input type="range" id="seek" min="0" max="${Math.max(1, Math.round(P.dur))}" step="1" value="${Math.round(P.pos)}" style="--p:${pct}%" ${!it || P.live ? 'disabled' : ''} aria-label="Seek">
          <div class="times mono"><span id="tPos">${fmt(P.pos)}</span><span id="tDur">${P.live ? 'LIVE' : '-' + fmt(P.dur - P.pos)}</span></div>
        </div>
        <div class="transport">
          <button class="icon-btn" data-act="back" title="Back ${S.settings.skip}s" aria-label="Back ${S.settings.skip} seconds" ${!it ? 'disabled' : ''}>${icon('back')}</button>
          <button class="icon-btn" data-act="stop" title="Stop casting" aria-label="Stop" ${!it ? 'disabled' : ''}>${icon('stop')}</button>
          <button class="icon-btn big" data-act="toggle" aria-label="${P.playing ? 'Pause' : 'Play'}" ${!it ? 'disabled' : ''}>${icon(P.playing ? 'pause' : 'play')}</button>
          <button class="icon-btn" data-act="next" title="Next in queue" aria-label="Next in queue">${icon('next')}</button>
          <button class="icon-btn" data-act="fwd" title="Forward ${S.settings.skip}s" aria-label="Forward ${S.settings.skip} seconds" ${!it ? 'disabled' : ''}>${icon('fwd')}</button>
        </div>
        <div class="knobs">
          <div class="knob wide"><button class="icon-btn" data-act="mute" aria-label="${P.muted ? 'Unmute' : 'Mute'}" style="width:30px;height:30px">${icon(P.muted ? 'mute' : 'vol')}</button>
            <input type="range" id="vol" min="0" max="100" value="${P.muted ? 0 : Math.round(P.vol * 100)}" style="--p:${P.muted ? 0 : P.vol * 100}%" aria-label="TV volume"><span class="mono muted" id="volTxt" style="width:34px;text-align:right">${P.muted ? 0 : Math.round(P.vol * 100)}</span></div>
          <div class="knob"><label for="rate">Speed</label><select id="rate">${[.5, .75, 1, 1.25, 1.5, 2].map(r => `<option value="${r}" ${r === P.rate ? 'selected' : ''}>${r}×</option>`).join('')}</select></div>
          <div class="knob"><label for="subBtn">Subtitles</label><button id="subBtn" class="btn ghost sm" data-act="subs" style="justify-content:flex-start;padding:0;background:none">${icon('cc')}${P.subName ? 'Turn off' : 'Load .srt / .vtt'}</button></div>
        </div>
        ${S.queue.length ? `<div class="meta" style="border-top:1px solid var(--line);padding-top:12px"><div class="eyebrow">Up next</div><div class="t" style="margin-top:6px">${esc(S.queue[0].title)}</div><div class="s">${S.queue.length} in queue · Autoplay ${S.settings.autoplay ? 'on' : 'off'}</div></div>` : ''}
      </div>
    </div>
    ${P.yt ? ytPanel() : ''}`;
  },

  mirror() {
    const dev = DEVICES.find(d => d.id === S.device);
    const live = !!M.stream;
    const sel = (id, label, opts, cur) => `<div class="knob"><label for="${id}">${label}</label><select id="${id}" ${live ? 'disabled' : ''}>${opts.map(([v, t]) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${t}</option>`).join('')}</select></div>`;
    const note = !dev ? 'Connect a screen to send the mirror to.'
      : dev.real ? 'Nearby screens can’t take a mirror straight from a web page. Use your browser’s Cast screen option below to put it on the TV.'
      : 'Demo receiver: the mirror shows in this preview. For a real TV, use the built-in mirroring steps below.';
    return `<div class="view-head"><div class="grow"><div class="eyebrow">Screen mirroring</div><h1>Mirror your screen</h1>
      <p>Show your whole screen, one window or a browser tab on the TV. Use it for slides, photos, games and sites that can’t be cast.</p></div></div>
    <div class="mirror">
      <div class="tv"><div class="screen" id="mscreen"></div>
        <div class="tv-foot"><span>${dev ? icon(dev.icon) + ' ' + esc(dev.name) : 'No screen connected'}</span><span class="mono" id="mStats">${live ? '' : canCapture ? 'Ready' : 'Not supported here'}</span></div></div>
      <div class="panel remote">
        <div><span class="status ${live ? 'live' : 'ready'}">${live ? '<span class="rec-dot"></span>Live · <span id="mTime">0:00</span>' : 'Not mirroring'}</span>
          <div class="title" style="margin-top:6px">${dev ? 'To ' + esc(dev.name) : 'No screen selected'}</div>
          <p class="muted" style="margin:4px 0 0;font-size:13.5px">${note}</p></div>
        <div class="knobs">
          ${sel('m-surface', 'Share', [['monitor', 'Entire screen'], ['window', 'A window'], ['browser', 'A browser tab']], M.surface)}
          ${sel('m-quality', 'Quality', [['720', '720p'], ['1080', '1080p'], ['1440', '1440p']], M.quality)}
          ${sel('m-fps', 'Frame rate', [[15, '15 fps · docs'], [30, '30 fps · video'], [60, '60 fps · games']], M.fps)}
          <div class="knob"><label for="m-audio">Sound</label><label style="display:flex;align-items:center;gap:8px;font-weight:600"><span class="switch"><input type="checkbox" id="m-audio" ${M.audio ? 'checked' : ''} ${live ? 'disabled' : ''}><i></i></span>${M.audio ? 'On' : 'Off'}</label></div>
        </div>
        ${live ? `<button class="btn" data-act="stopMirror" style="padding:12px">${icon('stop')}Stop mirroring</button>`
               : `<button class="btn primary" data-act="startMirror" style="padding:12px">${icon('mirror')}Start mirroring</button>`}
        ${dev ? '' : `<button class="btn ghost" data-act="devices">${icon('cast')}Connect a screen</button>`}
      </div>
    </div>
    ${M.error ? `<div class="notice bad" style="margin:0">${esc(M.error)}</div>` : ''}
    <section style="display:flex;flex-direction:column;gap:10px">
      <div><div class="eyebrow">Built-in mirroring</div><p class="muted" style="margin:6px 0 0;max-width:65ch">Every phone and computer can mirror to a TV on its own. These steps work with any real TV on your Wi-Fi${GUIDES[0].you ? ', and the one marked “This device” fits what you’re using now' : ''}.</p></div>
      <div class="guide">${GUIDES.map(g => `<article class="${g.you ? 'yours' : ''}"><h3>${icon(g.icon)}${esc(g.title)}${g.you ? '<span class="chip">This device</span>' : ''}</h3>
        <ol>${g.steps.map(x => `<li>${x}</li>`).join('')}</ol><div class="works">${esc(g.works)}</div></article>`).join('')}</div>
    </section>`;
  },

  queue() {
    return `<div class="view-head"><div class="grow"><div class="eyebrow">Play queue</div><h1>Up next</h1><p>Videos play in this order on ${esc(devName())}.</p></div>
      ${S.queue.length ? '<button class="btn" data-act="clearQueue">' + icon('x') + 'Clear</button><button class="btn" data-act="queueM3u">' + icon('vlc') + 'Save for VLC</button><button class="btn primary" data-act="next">' + icon('play') + 'Play next</button>' : ''}</div>
    <section class="panel"><div class="list" data-list="queue">${S.queue.length ? S.queue.map((m, i) => mediaRow(m,
      `<button class="icon-btn" data-act="up" aria-label="Move up" ${i ? '' : 'disabled'}>${icon('up')}</button><button class="icon-btn" data-act="down" aria-label="Move down" ${i < S.queue.length - 1 ? '' : 'disabled'}>${icon('down')}</button><button class="icon-btn" data-act="remove" aria-label="Remove">${icon('x')}</button>${A.cast}`,
      `<span class="qnum">${i + 1}</span>`).replace('class="row ', 'class="row q ')).join('') : '<div class="empty"><b>The queue is empty</b>Use “Queue” on any video to line it up.</div>'}</div></section>`;
  },

  local() {
    return `<div class="view-head"><div class="grow"><div class="eyebrow">This device</div><h1>Local files</h1><p>Cast videos and music stored on this computer or phone. Files stay on your device.</p></div></div>
    <label class="drop" id="drop" for="fileIn">${icon('upload')}<b>Drop videos here or choose files</b><span class="muted">MP4, WebM, MOV, MKV, MP3, M4A</span>
      <span class="btn primary">${icon('folder')}Choose files</span><input id="fileIn" type="file" accept="video/*,audio/*,.mkv" multiple hidden></label>
    <section class="panel"><div class="panel-h"><h2>Added this session</h2><span class="chip">${S.local.length}</span></div>
      <div class="list" data-list="local">${S.local.length ? S.local.map(m => mediaRow(m, A.queue + A.cast)).join('') : '<div class="empty"><b>No files yet</b>Files you add appear here.</div>'}</div></section>`;
  },

  iptv() {
    const ch = parseM3U(S.m3u);
    const groups = ['All', ...new Set(ch.map(c => c.group))];
    const q = S.chSearch.toLowerCase();
    const shown = ch.filter(c => (S.group === 'All' || c.group === S.group) && (!q || c.title.toLowerCase().includes(q)));
    views._ch = ch;
    return `<div class="view-head"><div class="grow"><div class="eyebrow">M3U playlist</div><h1>IPTV channels</h1><p>${ch.length} channels in ${groups.length - 1} groups.</p></div></div>
    <section class="panel">
      <div class="iptv-tools"><div class="search">${icon('search')}<input id="chSearch" value="${esc(S.chSearch)}" placeholder="Search channels" aria-label="Search channels"></div>
        <div class="chips">${groups.map(g => `<button class="fchip" data-group="${esc(g)}" aria-pressed="${g === S.group}">${esc(g)}</button>`).join('')}</div></div>
      <div class="channels" data-list="iptv">${shown.map(c => `<button class="ch" data-ch="${c.id}">${thumb({ ...c, duration: 0 })}<div class="cm"><b>${esc(c.title)}</b><span>${esc(c.group)} · ${fmtOf(c.url)}</span></div></button>`).join('') || '<div class="empty"><b>No channels match</b>Try another group or search.</div>'}</div>
      <details class="import"><summary>Load a playlist</summary><div class="body">
        <textarea id="m3uText" aria-label="M3U playlist">${esc(S.m3u)}</textarea>
        <div class="actions" style="flex-wrap:wrap"><label class="btn" for="m3uFile">${icon('upload')}Open .m3u file</label><input id="m3uFile" type="file" accept=".m3u,.m3u8,text/plain" hidden>
          <button class="btn ghost" data-act="m3uSample">Reset to sample</button><div style="flex:1"></div><button class="btn primary" data-act="m3uApply">Load channels</button></div>
      </div></details>
    </section>`;
  },

  bookmarks() {
    return `<div class="view-head"><div class="grow"><div class="eyebrow">Saved pages</div><h1>Bookmarks</h1><p>Pages you return to for videos. Tap the star in the address bar to add one.</p></div></div>
    <section class="panel"><div class="list" data-list="bookmarks">${S.bookmarks.length ? S.bookmarks.map(b => `<div class="row" data-id="${b.id}" style="grid-template-columns:40px minmax(0,1fr) auto">
      <div class="dev" style="padding:0;border:0"><span class="ico">${icon('star')}</span></div>
      <div class="meta"><div class="t">${esc(b.title)}</div><div class="u">${esc(b.url)}</div></div>
      <div class="actions"><button class="icon-btn" data-act="unbookmark" aria-label="Remove bookmark">${icon('x')}</button><button class="btn sm" data-act="openBm">${icon('globe')}Open</button></div></div>`).join('') : '<div class="empty"><b>No bookmarks</b>Use the star in the Browser to save a page.</div>'}</div></section>`;
  },

  history() {
    const day = t => { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago'; };
    return `<div class="view-head"><div class="grow"><div class="eyebrow">Recently cast</div><h1>History</h1><p>Pick up where you left off. Resume ${S.settings.resume ? 'is on' : 'is off'}.</p></div>
      ${S.history.length ? '<button class="btn" data-act="clearHistory">' + icon('x') + 'Clear history</button>' : ''}</div>
    <section class="panel"><div class="list" data-list="history">${S.history.length ? S.history.map(h => mediaRow({ ...h, res: `${day(h.at)} · stopped at ${fmt(h.pos)}${h.duration ? ' of ' + fmt(h.duration) : ''}` }, A.queue + `<button class="btn primary sm" data-act="cast">${icon('play')}${h.pos > 5 ? 'Resume' : 'Cast'}</button>`)).join('') : '<div class="empty"><b>Nothing cast yet</b>Videos you play show up here.</div>'}</div></section>`;
  },

  settings() {
    const st = S.settings;
    const sw = (id, on) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><i></i></label>`;
    const sel = (id, vals, cur) => `<select id="${id}">${vals.map(v => `<option ${String(v) === String(cur) ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
    return `<div class="view-head"><div class="grow"><div class="eyebrow">Preferences</div><h1>Settings</h1></div></div>
    <section class="panel">
      <div class="panel-h"><h2>Playback</h2></div>
      <div class="set"><div><b>Autoplay next in queue</b><span>Start the next video when one ends.</span></div>${sw('s-autoplay', st.autoplay)}</div>
      <div class="set"><div><b>Resume where I left off</b><span>Uses your history to continue a video.</span></div>${sw('s-resume', st.resume)}</div>
      <div class="set"><div><b>Skip buttons jump</b><span>Seconds for back and forward.</span></div>${sel('s-skip', [5, 10, 15, 30, 60], st.skip)}</div>
      <div class="set"><div><b>Preferred quality</b><span>For adaptive (HLS/DASH) streams.</span></div>${sel('s-quality', ['Auto', '1080p', '720p', '480p'], st.quality)}</div>
    </section>
    <section class="panel" id="geminiSettings">
      <div class="panel-h"><h2>Today (Gemini)</h2></div>
      <div class="set"><div><b>Gemini API key</b><span>${GM.server ? 'This server already has a key, so this one is only used if you open the app elsewhere.' : 'Lets answers show in the app. Get a free key at aistudio.google.com/apikey. It’s stored on this device only.'}</span></div><input id="s-geminiKey" type="password" value="${esc(st.geminiKey)}" placeholder="AIza…" autocomplete="off" style="width:min(240px,100%);height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font:13px var(--f-mono)"></div>
      <div class="set"><div><b>Gemini model</b><span>Any model that supports Google Search grounding.</span></div><input id="s-geminiModel" value="${esc(st.geminiModel)}" style="width:min(240px,100%);height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font:13px var(--f-mono)"></div>
      <div class="set"><div><b>News country</b><span>Two-letter code, for example US, GB, IN. Leave empty to use ${esc(country())}.</span></div><input id="s-region" value="${esc(st.region)}" maxlength="2" placeholder="${esc(REGION)}" style="width:80px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);text-transform:uppercase"></div>
      <div class="set"><div><b>Temperature</b><span>Used for weather.</span></div>${sel('s-units', ['Auto', '°C', '°F'], st.units === 'C' ? '°C' : st.units === 'F' ? '°F' : 'Auto')}</div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Subtitles</h2></div>
      <div class="set"><div><b>Text size on TV</b><span>Applies to .srt and .vtt files.</span></div>${sel('s-subSize', ['Small', 'Medium', 'Large'], st.subSize)}</div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Devices</h2></div>
      <div class="set"><div><b>Suggest VLC for unsupported videos</b><span>Offers VLC when a format such as MKV, AVI or DASH won’t play in the browser.</span></div>${sw('s-vlcFallback', st.vlcFallback)}</div>
      <div class="set"><div><b>VLC bridge address</b><span>Where the StreamBeam server (server.mjs) runs. Leave empty to use ${esc(vlcBase())}.</span></div><input id="s-vlcBridge" value="${esc(st.vlcBridge)}" placeholder="http://localhost:8090" style="width:min(240px,100%);height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font:13px var(--f-mono)"></div>
      <div class="set"><div><b>Show demo devices</b><span>Simulated Chromecast, Roku, Fire TV, DLNA and AirPlay receivers for trying the app. “Nearby screen” uses your browser’s real casting.</span></div>${sw('s-demo', st.demo)}</div>
    </section>`;
  }
};

function ytLink() {
  const y = P.yt; if (!y) return '';
  return y.id ? `https://www.youtube.com/watch?v=${y.id}${y.list ? '&list=' + y.list : ''}${P.pos > 5 ? '&t=' + Math.floor(P.pos) + 's' : ''}` : ytUrl(y);
}
function vlcPanel() {
  if (S.device === 'vlc' && !V.ok) {
    const pw = 'choose-a-password';
    return `<section class="panel yt-tv"><h2>${icon('vlc')} Connect VLC</h2>
      ${V.err ? `<div class="notice bad" style="margin:0">${esc(V.err)}</div>` : ''}

function findItem(row) {

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-site],[data-ch],[data-group],[data-ask],[data-copyask]');
  if (!b || scrim.contains(b)) return;
  if (b.dataset.ask) return ask(b.dataset.ask);
  if (b.dataset.copyask) {
    const t = TILES.find(x => x.id === b.dataset.copyask);
    navigator.clipboard.writeText(t.prompt()).then(() => toast('Question copied. Paste it in Gemini.'), () => toast('Opening Gemini. Ask: ' + t.label));
    return;
  }
  if (b.dataset.site) { const s = SITES.find(x => x.id === b.dataset.site); return browse(s.url); }
  if (b.dataset.ch) { const c = views._ch.find(x => x.id === b.dataset.ch); return c && playItem(c, { from: 0 }); }
  if (b.dataset.group) { S.group = b.dataset.group; return render(); }
  const act = b.dataset.act;
  const row = b.closest('.row'); const ctx = row ? findItem(row) : {};
  switch (act) {
    case 'cast': if (ctx.list === 'queue') { S.queue.splice(ctx.idx, 1); save(); } playItem(ctx.item, ctx.list === 'history' ? { from: ctx.item.pos > 5 ? ctx.item.pos : 0 } : {}); break;
    case 'enqueue': S.queue.push({ ...ctx.item, id: uid() }); save(); toast(`Added to queue · ${S.queue.length} up next`); render(); break;
    case 'queueAll': S.detected.forEach(m => S.queue.push({ ...m, id: uid() })); save(); toast(`Queued ${S.detected.length} videos`); render(); break;
    case 'copy': try { await navigator.clipboard.writeText(ctx.item.url); toast('Link copied'); } catch { toast('Copy blocked. Select the link text instead.'); } break;
    case 'remove': S.queue.splice(ctx.idx, 1); save(); render(); break;
    case 'up': case 'down': { const j = ctx.idx + (act === 'up' ? -1 : 1); [S.queue[ctx.idx], S.queue[j]] = [S.queue[j], S.queue[ctx.idx]]; save(); render(); break; }
    case 'clearQueue': S.queue = []; save(); toast('Queue cleared'); render(); break;
    case 'clearHistory': S.history = []; save(); toast('History cleared'); render(); break;
    case 'toggle': toggle(); break;
    case 'back': seek(P.pos - S.settings.skip); break;
    case 'fwd': seek(P.pos + S.settings.skip); break;
    case 'stop': stop(); toast('Stopped casting'); break;
    case 'next': next(); break;
    case 'mute': P.muted = !P.muted; video.muted = P.muted; if (ytOn()) P.muted ? Y.player.mute() : Y.player.unMute(); send('volume', { val: P.muted ? 0 : Math.round(P.vol * 256) }); render(); break;

    case 'geminiSetup': S.view = 'settings'; render(); $('#geminiSettings')?.scrollIntoView(); $('#s-geminiKey')?.focus(); break;
    case 'locate': locate(); break;
    case 'speak': speak(); break;
    case 'copyAnswer': try { await navigator.clipboard.writeText(GM.answer.text); toast('Copied'); } catch { toast('Copy blocked. Select the text instead.'); } break;
    case 'vlcConnect': S.settings.vlcBridge = ($('#vlcBridge')?.value || '').trim(); save(); vlcConnect(); break;
    case 'vlcUse': S.device = 'vlc'; save(); if (P.item) playItem(P.item, { from: P.pos }); else vlcConnect(); break;
    case 'queueM3u': saveM3u(S.queue, 'StreamBeam queue'); break;
